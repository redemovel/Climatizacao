function paraData(v) {
  if (!v) return null;

}
const fmtData = (v, o = { day: '2-digit', month: '2-digit', year: 'numeric' }) => { const d = paraData(v); return d ? d.toLocaleDateString('pt-PT', o) : '—'; };
const fmtHora = (v) => { const d = paraData(v); return d ? d.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }) : ''; };
const fmtDataHora = (v) => { const d = paraData(v); return d ? fmtData(d) + ' ' + fmtHora(d) : '—'; };
const fmtDiaSemana = (d) => { const t = d.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' }); return t.charAt(0).toUpperCase() + t.slice(1); };
function inicioDia(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function addDias(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function inicioSemana(d) { const x = inicioDia(d); const dow = (x.getDay() + 6) % 7; return addDias(x, -dow); } // segunda-feira

function deIsoLocal(s, hora = '00:00') { const [y, m, d] = s.split('-').map(Number); const [h, mi] = hora.split(':').map(Number); return new Date(y, m - 1, d, h || 0, mi || 0); }

// NIF: português com dígito de controlo; estrangeiro com indicativo do país (ex.: ES B12345678).
function validarNIF(entrada) {
  const v = String(entrada || '').toUpperCase().replace(/[\s.\-/]/g, '');
  if (!v) return { ok: false, erro: 'O NIF é obrigatório.' };
  const pt = v.startsWith('PT') ? v.slice(2) : v;
  if (/^\d+$/.test(pt)) {
    if (pt.length !== 9) return { ok: false, erro: 'O NIF português tem 9 dígitos.' };
    if (!/^([1235689]|45|7[0-9])/.test(pt)) return { ok: false, erro: 'NIF português com início inválido.' };
    let soma = 0;
    for (let i = 0; i < 8; i++) soma += Number(pt[i]) * (9 - i);
    let ctrl = 11 - (soma % 11);
    if (ctrl >= 10) ctrl = 0;
    if (ctrl !== Number(pt[8])) return { ok: false, erro: 'NIF inválido (dígito de controlo errado).' };
    return { ok: true, nif: pt, pais: 'PT' };
  }
  const m = v.match(/^([A-Z]{2})([A-Z0-9]{2,13})$/);
  if (m && m[1] !== 'PT' && /\d/.test(m[2])) return { ok: true, nif: v, pais: m[1] };
  return { ok: false, erro: 'NIF inválido. Estrangeiro: indicativo do país + número (ex.: ES B12345678).' };
}

    'unavailable': 'Sem ligação ao servidor. Tente de novo.',
    'failed-precondition': 'Falta um índice na base de dados (ver consola do browser).',
  };
  if (c === 'failed-precondition') console.error('[Firestore] índice em falta:', e.message);
  return mapa[c] || (e && e.message) || 'Erro inesperado.';
}

// Modal genérico (folha inferior no telemóvel). Devolve o elemento do conteúdo.
function abrirModal(titulo, html, { aoFechar } = {}) {
  fecharModal();
  const fundo = document.createElement('div');
  fundo.className = 'modal-fundo';
  fundo.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">

  document.body.appendChild(fundo);
  document.body.classList.add('com-modal');
  return $('.modal-corpo', fundo);
}
function fecharModal() { $$('.modal-fundo').forEach((m) => m.remove()); document.body.classList.remove('com-modal'); }

function confirmar(msg, { ok = 'Confirmar', perigo = false } = {}) {
  return new Promise((resolve) => {
    const c = abrirModal('Confirmar', `<p>${esc(msg)}</p><div class="acoes">
      <button class="btn" data-r="0">Cancelar</button>
      <button class="btn ${perigo ? 'btn-perigo' : 'btn-primario'}" data-r="1">${esc(ok)}</button></div>`,
    { aoFechar: () => resolve(false) });
    c.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-r]');
      if (!b) return;
      fecharModal();
      resolve(b.dataset.r === '1');
    });
  });
}

async function comBotao(btn, fn) {
  if (btn.disabled) return;

}

// ---------- Sessão, cabeçalho e menu ----------
let SESSAO = null;

const ICONES = {
  agenda: '<svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2zM5 9h14v11H5zm2 2v2h2v-2zm4 0v2h2v-2zm4 0v2h2v-2z"/></svg>',

};

function montarCabecalho() {
  const nome = (SESSAO.nome || SESSAO.email || '').split(' ')[0];

    <a class="marca" href="${pagina('agenda')}"><img src="img/arvore-branca.png" alt="">Climatização${ENV === 'dev' ? ' <span class="tag-dev">DEV</span>' : ''}</a>

    <button class="btn-sair" id="btnSair" title="Terminar sessão">Sair</button>`;
  $('#btnSair').onclick = async () => { await signOut(auth); location.replace(pagina('index')); };
  $('#nav').innerHTML = MENU.filter((m) => m.perfis.includes(SESSAO.perfil)).map((m) =>
    `<a href="${pagina(m.id)}" class="${m.id === PAGINA ? 'ativo' : ''}" data-menu="${m.id}">${ICONES[m.id]}<span>${esc(m.curto || m.label)}</span></a>`).join('');
}

// Garante sessão iniciada com perfil ativo. Sem sessão → login. Sem perfil → login (mostra o UID).
function iniciarPagina({ perfis = null } = {}) {
  return new Promise((resolve) => {
    let feito = false;
    onAuthStateChanged(auth, async (user) => {
      if (feito) return;
      feito = true;
      if (!user) { location.replace(pagina('index')); return; }
      try {
        const snap = await getDoc(doc(db, 'utilizadores', user.uid));
        if (!snap.exists() || snap.data().ativo !== true) { location.replace(pagina('index')); return; }
        SESSAO = { uid: user.uid, email: user.email, ...snap.data() };
      } catch (e) {
        $('#main').innerHTML = `<div class="vazio">Não foi possível carregar o perfil: ${esc(erroFirebase(e))}</div>`;
        return;
      }
      montarCabecalho();
      if (perfis && !perfis.includes(SESSAO.perfil)) {
        $('#main').innerHTML = '<div class="vazio">Não tem acesso a esta página.</div>';
        return;
      }
      document.body.classList.add('perfil-' + SESSAO.perfil);
      resolve(SESSAO);
    });
  });
}

// ---------- Pesquisa de clientes ----------
// Cada cliente guarda `pesquisa`: prefixos (2+ letras) de cada palavra do nome e da localidade.
// Assim "hot" encontra "Hotel Meliá" e "meli" também, com uma só consulta (array-contains).
const normalizar = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function tokensPesquisa(...textos) {
  const set = new Set();
  for (const t of textos) {
    for (const p of normalizar(t).split(/[^a-z0-9]+/)) {
      for (let i = 2; i <= Math.min(p.length, 15); i++) set.add(p.slice(0, i));
    }
  }
  return [...set];
}

async function pesquisarClientes(texto, { soAtivos = false } = {}) {
  const t = String(texto || '').trim();
  const n = validarNIF(t);
  const palavras = normalizar(t).split(/[^a-z0-9]+/).filter((p) => p.length >= 2).map((p) => p.slice(0, 15));
  let docs = [];
  if (n.ok) {
    docs = (await getDocs(query(collection(db, 'clientes'), where('nif', '==', n.nif), limit(10)))).docs;
  } else {
    const consultas = [];
    if (palavras.length) {
      const chave = palavras.reduce((a, b) => (b.length > a.length ? b : a));
      consultas.push(getDocs(query(collection(db, 'clientes'), where('pesquisa', 'array-contains', chave), limit(PAGINA_TAM)))
        .then((sn) => sn.docs.filter((d) => palavras.every((p) => (d.data().pesquisa || []).includes(p)))));
    }
    // início do nome, também para siglas («M. D.», «MDA» → «m. d. a. - moldes…» / «m.d.a.»)
    for (const pre of prefixosNome(t)) {
      consultas.push(getDocs(query(collection(db, 'clientes'), orderBy('nomePesquisa'), startAt(pre), endAt(pre + '\uf8ff'), limit(PAGINA_TAM))).then((sn) => sn.docs));
    }
    const vistos = new Set();
    for (const l of await Promise.all(consultas)) for (const d of l) if (!vistos.has(d.id)) { vistos.add(d.id); docs.push(d); }
  }
  return docs.map((d) => ({ id: d.id, ...d.data() }))
    .filter((c) => !soAtivos || c.ativo !== false)
    .sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt'));
}
function prefixosNome(t) {
  const base = normalizar(t).replace(/\s+/g, ' ').trim();
  if (base.length < 2) return [];
  const l = new Set([base]);
  const letras = base.replace(/[^a-z0-9]/g, '');
  // parece uma sigla: letras soltas com pontos/espaços, ou uma palavra curta
  if (letras.length >= 2 && letras.length <= 5 && (/^([a-z0-9][. ]*)+$/.test(base) && (base.includes('.') || base.includes(' ') || letras.length <= 4))) {
    const c = letras.split('');
    l.add(c.join('. ') + '.'); l.add(c.join('.') + '.'); l.add(c.join(' '));
  }
  return [...l].slice(0, 4);
}

// ---------- Duração prevista: real (mediana do PHC, calculada pela PontePHC em listas/duracoes) ou por omissão ----------
// duração habitual de um tipo, sem esperar (depois de duracaoSugerida já ter sido chamada uma vez)
function duracaoTipo(tipo) {
  const t = ((_duracoesDados || {}).porTipo || {})[tipo];
  return t && t.n >= 5 ? t.h : (DURACAO_PADRAO[tipo] || 2);
}
const fmtHorasD = (h) => String(Number(h) || 0).replace('.', ',') + ' h';
const DURACAO_PADRAO = { AT: 2, 'Manutenção': 1.5, 'Instalação': 4 };
let _duracoes = null, _duracoesDados = null;
async function duracaoSugerida(clienteId, tipo) {
  if (!_duracoes) {
    _duracoes = getDoc(doc(db, 'listas', 'duracoes')).then((s) => (s.exists() ? s.data() : {})).catch(() => ({}));
  }
  const d = await _duracoes;
  _duracoesDados = d;
  const c = ((d.porCliente || {})[clienteId] || {})[tipo];
  if (c && c.n >= 2) return { h: c.h, n: c.n, fonte: 'cliente' };
  const t = (d.porTipo || {})[tipo];
  if (t && t.n >= 5) return { h: t.h, n: t.n, fonte: 'tipo' };
  return { h: DURACAO_PADRAO[tipo] || 2, n: 0, fonte: 'padrao' };
}

// ---------- Artigos (stock do armazém da climatização, vindo do PHC) ----------
// disponível = stock − reservado em FO abertas no PHC − ainda em guias abertas no PHC
//              − reservado em folhas da plataforma − em guias abertas da plataforma
const r3 = (n) => Math.round((Number(n) || 0) * 1000) / 1000;
function disponivel(a) {
  return r3((a.stock || 0) - (a.reservadoPHC || 0) - (a.emGuiasPHC || 0) - (a.resFolhas || 0) - (a.resGuias || 0));
}
const fmtQtd = (n) => r3(n).toLocaleString('pt-PT', { maximumFractionDigits: 3 });
async function pesquisarArtigos(texto) {
  const palavras = normalizar(texto).split(/[^a-z0-9]+/).filter((p) => p.length >= 2).map((p) => p.slice(0, 15));
  if (!palavras.length) return [];
  const chave = palavras.reduce((a, b) => (b.length > a.length ? b : a));
  const snap = await getDocs(query(collection(db, 'artigos'), where('pesquisa', 'array-contains', chave), limit(PAGINA_TAM)));
  return snap.docs.map((d) => ({ id: d.id, ...d.data() }))
    .filter((a) => a.ativo !== false && palavras.every((p) => (a.pesquisa || []).includes(p)))
    .sort((a, b) => disponivel(b) - disponivel(a) || (a.ref || '').localeCompare(b.ref || ''));
}
// Acumula movimentos de reserva por artigo e aplica-os dentro de uma transação (lê primeiro, escreve depois).
// mov: { artigoId: { resFolhas: +x, resGuias: -y } }; exigeDisponivel: artigos que não podem ficar negativos.
async function aplicarReservas(tx, mov, exigeDisponivel = new Set()) {
  const ids = Object.keys(mov);
  const docs = {};
  for (const id of ids) {
    const s = await tx.get(doc(db, 'artigos', id));
    if (!s.exists()) throw Object.assign(new Error('Artigo não encontrado: ' + id), { code: 'artigo' });
    docs[id] = s.data();
  }
  return () => {
    for (const id of ids) {
      const a = docs[id];
      const novo = { resFolhas: r3((a.resFolhas || 0) + (mov[id].resFolhas || 0)), resGuias: r3((a.resGuias || 0) + (mov[id].resGuias || 0)) };
      if (novo.resFolhas < 0) novo.resFolhas = 0;
      if (novo.resGuias < 0) novo.resGuias = 0;
      if (exigeDisponivel.has(id) && disponivel({ ...a, ...novo }) < -0.0005) {
        throw Object.assign(new Error(`Sem stock disponível de ${a.ref} (disponível: ${fmtQtd(disponivel(a))} ${a.unidade || ''}).`), { code: 'stock' });
      }
      tx.update(doc(db, 'artigos', id), { ...novo, resAtualizadoEm: serverTimestamp() });
    }
  };
}
// N.º de série → id do documento em series/ (maiúsculas, sem espaços; «/» e outros trocados por ~XX)
function idSerie(sr) {
  return String(sr || '').toUpperCase().replace(/\s+/g, '').replace(/[^A-Z0-9._-]/g, (c) => '~' + c.charCodeAt(0).toString(16).toUpperCase().padStart(2, '0'));
}
function limparSerie(sr) { return String(sr || '').trim().toUpperCase().replace(/\s+/g, ''); }

// Procura um n.º de série: onde está a ser usado na plataforma (series/) e, se estiver no armazém AC do PHC
// (equipamentos/, vindo da tabela MA pela PontePHC), o artigo a que pertence. Só a pedido (2–3 leituras).
async function procurarSerie(texto) {
  const t = limparSerie(texto);
  if (t.length < 3 || /\s/.test(String(texto).trim())) return null;
  const id = idSerie(t);
  const [so, se] = await Promise.all([getDoc(doc(db, 'series', id)), getDoc(doc(db, 'equipamentos', id)).catch(() => null)]);
  const r = { serie: t, uso: so.exists() ? so.data() : null, equip: se && se.exists() ? se.data() : null, artigo: null };
  if (r.equip) r.serie = r.equip.serie || t;
  if (r.equip && r.equip.artigoId) {
    try { const a = await getDoc(doc(db, 'artigos', r.equip.artigoId)); if (a.exists()) r.artigo = { id: a.id, ...a.data() }; } catch (e) { /* sem artigo */ }
  }
  return r.uso || r.equip ? r : null;
}

// Ao faturar/anular uma folha, o material dela deixa de estar reservado na plataforma.
function movLibertarFolha(f) {
  const mov = {};
  for (const m of f.materiais || []) if (m.artigoId) (mov[m.artigoId] = mov[m.artigoId] || { resFolhas: 0 }).resFolhas -= Number(m.qtd) || 0;
  return mov;
}

// ---------- «Sincronizar com o PHC agora» (staff): a PontePHC vê o pedido em ~30 s e corre um ciclo completo ----------
async function pedirSincronizacao(btn, aoConcluir) {
  await comBotao(btn, async () => {
    const ref = doc(db, 'controlo', 'sincronizar');
    try {
      await setDoc(ref, { estado: 'Pedido', pedidoEm: serverTimestamp(), pedidoPor: SESSAO.uid, pedidoPorNome: SESSAO.nome || SESSAO.email });
    } catch (e) { toast(erroFirebase(e), 'erro'); return; }
    toast('Pedido enviado ao servidor. A sincronização demora 1 a 2 minutos…', 'ok', 6000);
    for (let i = 0; i < 24; i++) {   // até 4 minutos, uma leitura a cada 10 s
      await new Promise((r) => setTimeout(r, 10000));
      let d;
      try { d = (await getDoc(ref)).data() || {}; } catch (e) { continue; }
      if (d.estado === 'Concluído') {
        toast('Sincronização com o PHC concluída' + (d.resultado && d.resultado !== 'OK' ? ': ' + d.resultado : '.'), d.resultado === 'OK' ? 'ok' : 'erro', 6000);
        if (aoConcluir) aoConcluir();
        return;
      }
    }
    toast('O servidor ainda não respondeu. Confirme que o serviço PontePHC está a correr.', 'erro', 8000);
  });
}

// ---------- Folhas de obra: criação (partilhada pela página Folhas e pela geração dos contratos) ----------
// Prefixos para a pesquisa (n.º, cliente, NIF, avaria) — iguais aos que a PontePHC grava nas folhas do PHC.
function tokensFolha(numero, clienteNome, nif, descricao) {
  const n = String(numero || '');
  return tokensPesquisa(n, n.split('-').pop().replace(/^0+/, ''), clienteNome, String(nif || '').replace(/\D/g, ''), descricao).slice(0, 400);
}
// Numeração FO-AAAA-NNNN no contador do ano; toda a folha nova nasce «Por agendar». extraTx(tx, fRef, numero) corre na mesma transação.
async function criarFolhaNova(cliente, dados, extraTx = null) {
  const ano = new Date().getFullYear();
  const cRef = doc(db, 'contadores', 'folhas-' + ano);
  const fRef = doc(collection(db, 'folhas'));
  let numero = '';
  await runTransaction(db, async (tx) => {
    const c = await tx.get(cRef);
    const pre = extraTx ? await extraTx(tx, null, null) : null;   // leituras extra (antes das escritas)
    const n = (c.exists() ? c.data().valor : 0) + 1;
    numero = `FO-${ano}-${String(n).padStart(4, '0')}`;
    tx.set(cRef, { valor: n });
    tx.set(fRef, {
      ...dados,
      numero,
      clienteId: cliente.id, clienteNome: cliente.nome, clienteNif: cliente.nif || '', clienteEmail: dados.clienteEmail || cliente.email || '',
      pesquisa: tokensFolha(numero, cliente.nome, cliente.nif, dados.descricao),
      estado: 'Por agendar',
      historico: [{ estado: 'Por agendar', de: null, uid: SESSAO.uid, nome: SESSAO.nome || SESSAO.email, em: Timestamp.now(), ...(dados.contratoId ? { nota: 'Gerada pelo contrato ' + dados.contratoNumero } : {}) }],
      observacoesTecnico: '',
      criadoEm: serverTimestamp(), criadoPor: SESSAO.uid, criadoPorNome: SESSAO.nome || SESSAO.email,
      estadoAlteradoEm: serverTimestamp(),
    });
    if (pre) pre(fRef, numero);
  });
  return fRef.id;
}

// ---------- Contratos de manutenção ----------
const PERIODICIDADES = { Mensal: 1, Bimestral: 2, Trimestral: 3, Semestral: 6, Anual: 12 };
function addMeses(d, n) {
  const x = new Date(d);
  const dia = x.getDate();
  x.setDate(1); x.setMonth(x.getMonth() + n);
  const ult = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate();
  x.setDate(Math.min(dia, ult));
  return x;
}
// Quando gerar a folha da visita: «antecedência» dias antes da data da visita.
function dataGeracao(proxima, antecedencia) { return addDias(inicioDia(proxima), -(Number(antecedencia) || 0)); }
function descricaoVisita(ct) {
  const eq = (ct.equipamentos || []).map((e) => [e.descricao, e.marca, e.serie ? 'n.º ' + e.serie : '', e.local].filter(Boolean).join(' · '));
  return [`Manutenção ${String(ct.periodicidade || '').toLowerCase()} — contrato ${ct.numero}.`, ct.ambito || '', eq.length ? 'Equipamentos:\n- ' + eq.join('\n- ') : '']
    .filter(Boolean).join('\n');
}
// Gera a folha da próxima visita de um contrato e avança a próxima data, numa só transação (nunca duplica).
async function gerarVisitaContrato(ctId, { forcar = false } = {}) {
  const ctRef = doc(db, 'contratos', ctId);
  const ct0 = (await getDoc(ctRef)).data();
  if (!ct0 || ct0.estado !== 'Ativo' || !ct0.proximaData) return null;
  const prox = paraData(ct0.proximaData);
  if (!forcar && dataGeracao(prox, ct0.antecedenciaDias) > new Date()) return null;
  if (ct0.dataFim && prox > paraData(ct0.dataFim) && !ct0.renovacaoAutomatica) return null;
  const [h, m] = String(ct0.horaPreferida || '09:00').split(':').map(Number);
  const quando = new Date(prox); quando.setHours(h || 9, m || 0, 0, 0);
  const cliente = { id: ct0.clienteId, nome: ct0.clienteNome, nif: ct0.clienteNif || '', email: ct0.clienteEmail || '' };
  const dados = {
    tipo: 'Manutenção', tecnicoUid: ct0.tecnicoUid || '', tecnicoNome: ct0.tecnicoNome || '',
    dataPrevista: Timestamp.fromDate(quando), duracaoPrevista: Number(ct0.duracaoPrevista) || 0,
    morada: ct0.morada || '', codigoPostal: ct0.codigoPostal || '', localidade: ct0.localidade || '', contacto: ct0.contacto || '', telefone: ct0.telefone || '',
    descricao: descricaoVisita(ct0), tarefasExtra: (ct0.tarefas || []).slice(0, 30),
    origem: 'contrato', contratoId: ctId, contratoNumero: ct0.numero, atualizadoEm: serverTimestamp(), atualizadoPor: SESSAO.uid,
  };
  let gerada = null;
  const id = await criarFolhaNova(cliente, dados, async (tx) => {
    const s = await tx.get(ctRef);
    const ct = s.data();
    // outro utilizador gerou entretanto?
    if (!ct || ct.estado !== 'Ativo' || !ct.proximaData || paraData(ct.proximaData).getTime() !== prox.getTime()) throw Object.assign(new Error('já gerada'), { code: 'ja-gerada' });
    return (fRef, numero) => {
      let nova = addMeses(prox, PERIODICIDADES[ct.periodicidade] || 12);
      const alt = { proximaData: Timestamp.fromDate(nova), geracaoEm: Timestamp.fromDate(dataGeracao(nova, ct.antecedenciaDias)),
        ultimaVisita: Timestamp.fromDate(prox), atualizadoEm: serverTimestamp(), atualizadoPor: SESSAO.uid,
        folhas: [{ folhaId: fRef.id, numero, data: Timestamp.fromDate(quando) }, ...(ct.folhas || [])].slice(0, 24) };
      // fim do contrato: renova por mais um ano, ou deixa de gerar
      if (ct.dataFim && nova > paraData(ct.dataFim)) {
        if (ct.renovacaoAutomatica) alt.dataFim = Timestamp.fromDate(addMeses(paraData(ct.dataFim), 12));
        else alt.geracaoEm = Timestamp.fromDate(new Date(2999, 0, 1));
      }
      tx.update(ctRef, alt);
      gerada = numero;
    };
  }).catch((e) => { if (e.code === 'ja-gerada') return null; throw e; });
  return id ? { id, numero: gerada } : null;
}
// Gera todas as visitas em falta (contratos ativos com data de geração já passada). Corre ao abrir as páginas (staff), no máx. 1 vez por hora neste aparelho.
async function gerarManutencoesPendentes({ forcar = false } = {}) {
  if (!ehStaff(SESSAO.perfil)) return [];
  const chave = 'manut.ultima.' + SESSAO.uid;
  try { if (!forcar && Date.now() - Number(localStorage.getItem(chave) || 0) < 3600e3) return []; } catch (e) { /* sem storage */ }
  const feitas = [];
  try {
    for (let volta = 0; volta < 3; volta++) {   // até 3 visitas em atraso por contrato
      const snap = await getDocs(query(collection(db, 'contratos'), where('estado', '==', 'Ativo'), where('geracaoEm', '<=', Timestamp.now()), orderBy('geracaoEm'), limit(20)));
      if (snap.empty) break;
      let nesta = 0;
      for (const d of snap.docs) { const r = await gerarVisitaContrato(d.id); if (r) { feitas.push(r); nesta++; } }
      if (!nesta) break;
    }
    try { localStorage.setItem(chave, String(Date.now())); } catch (e) { /* sem storage */ }
  } catch (e) { console.warn('Contratos:', e); }
  return feitas;
}

// Lista de técnicos ativos (coleção pequena; lida uma vez por página).
let _tecnicos = null;
async function carregarTecnicos() {
  if (_tecnicos) return _tecnicos;
  const col = collection(db, 'utilizadores');
  const [a, b] = await Promise.all([
    getDocs(query(col, where('perfil', '==', 'tecnico'), where('ativo', '==', true), limit(50))),
    getDocs(query(col, where('tecnico', '==', true), where('ativo', '==', true), limit(50))),
  ]);
  const mapa = new Map();
  for (const d of [...a.docs, ...b.docs]) mapa.set(d.id, { uid: d.id, ...d.data() });
  _tecnicos = [...mapa.values()].sort((x, y) => (x.nome || '').localeCompare(y.nome || '', 'pt'));
  return _tecnicos;
}

function intervalo() {
  const ini = vista === 'semana' ? inicioSemana(base) : inicioDia(base);
  return { ini, fim: addDias(ini, vista === 'semana' ? 7 : 1) };
}

function marcarVista() {

// Trabalhos de dias anteriores que ainda não foram concluídos (só quando o período inclui hoje).
const cacheAtrasos = {};
async function carregarAtrasos() {
  const box = $('#atrasos');
  const { ini, fim } = intervalo();
  const hoje = inicioDia(new Date());
  if (!(hoje >= ini && hoje < fim)) { box.innerHTML = ''; return; }
  const tec = staff ? filtroTec : sessao.uid;
  const chave = tec || '*';
  if (!(chave in cacheAtrasos)) {
    const c = [];
    if (tec) c.push(where('tecnicoUid', '==', tec));
    const limiteAntigo = addDias(hoje, -DIAS_ATRASO);
    c.push(where('estado', 'in', ESTADOS_ABERTOS), where('dataPrevista', '>=', Timestamp.fromDate(limiteAntigo)),
      where('dataPrevista', '<', Timestamp.fromDate(hoje)), orderBy('dataPrevista'), limit(20));
    try {
      const snap = await getDocs(query(collection(db, 'folhas'), ...c));
      const l = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      const antigas = staff ? `<a class="muted" style="display:block;margin:0 6px 10px" href="${pagina('folhas', { filtro: 'antigas' })}">Ver folhas abertas há mais de ${DIAS_ATRASO} dias ›</a>` : '';
      cacheAtrasos[chave] = l.length ? `<details class="atrasos" ${l.length <= 3 ? 'open' : ''}>
        <summary>Em atraso <span class="badge estado-pendente-material">${l.length}${l.length === 20 ? '+' : ''}</span></summary>
        ${l.map((f) => cartao(f, true)).join('')}${antigas}</details>` : antigas;
    } catch (e) { cacheAtrasos[chave] = ''; console.error(e); toast(erroFirebase(e), 'erro'); }
  }
  if ((staff ? filtroTec : sessao.uid) === tec) box.innerHTML = cacheAtrasos[chave];
}

async function carregar(mais = false) {
  marcarVista();
  if (!mais) carregarAtrasos();
  if (!mais) { itens = []; cursor = null; $('#lista').innerHTML = '<div class="vazio">A carregar…</div>'; }
  const { ini, fim } = intervalo();
  const tec = staff ? (vista === 'equipa' ? '' : filtroTec) : sessao.uid;
  const c = [];
  if (tec) c.push(where('tecnicoUid', '==', tec));
  if (!mostrarConcl) c.push(where('estado', 'in', ESTADOS_ABERTOS));   // agenda = trabalho por fazer
  c.push(where('dataPrevista', '>=', Timestamp.fromDate(ini)), where('dataPrevista', '<', Timestamp.fromDate(fim)), orderBy('dataPrevista'));
  if (cursor) c.push(startAfter(cursor));
  c.push(limit(AG_LIMITE));
  try {
    const snap = await getDocs(query(collection(db, 'folhas'), ...c));
    itens = itens.concat(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    cursor = snap.docs[snap.docs.length - 1] || cursor;
    $('#maisWrap').classList.toggle('oculto', snap.docs.length < AG_LIMITE);
    render();
  } catch (e) {
    $('#lista').innerHTML = `<div class="vazio">${esc(erroFirebase(e))}</div>`;
  }
}

function cartao(f, comData = false) {
  const est = classeEstado(f.estado).replace('estado-', 'b-');
  const tel = linkTel(f.telefone);
  const mapa = linkMapa(f);
  return `<div class="lista-item ${est}" data-id="${esc(f.id)}">
    <div class="ag-item">
      <div class="hora">${comData ? `<small class="hora-data">${esc(fmtData(f.dataPrevista, { day: '2-digit', month: '2-digit' }))}</small>` : ''}${esc(fmtHora(f.dataPrevista))}</div>
      <div class="ag-corpo">
        <div class="li-topo"><span class="li-titulo">${esc(f.clienteNome)}</span>${badgeEstado(f.estado)}</div>
        <div class="li-sub">${esc([f.morada, f.localidade].filter(Boolean).join(', ') || 'Sem morada')}</div>
        <div class="li-meta"><span class="tipo">${esc(TIPO_NOME[f.tipo] || f.tipo)}</span><span>${esc(f.numero || '')}</span>${f.duracaoPrevista ? `<span>· ${esc(String(f.duracaoPrevista).replace('.', ','))} h</span>` : ''}
          ${staff ? `<span>· ${esc(f.tecnicoNome || '')}</span>` : ''}</div>
        ${f.descricao ? `<div class="li-sub">${esc(f.descricao.length > 120 ? f.descricao.slice(0, 120) + '…' : f.descricao)}</div>` : ''}
        ${(tel || mapa) ? `<div class="ag-acoes">
          ${tel ? `<a class="btn btn-peq btn-sec" href="${esc(tel)}" data-ext>Ligar</a>` : ''}
          ${mapa ? `<a class="btn btn-peq btn-sec" href="${esc(mapa)}" target="_blank" rel="noopener" data-ext>Navegar</a>` : ''}</div>` : ''}
      </div>
    </div></div>`;
}

function render() {
  if (vista === 'equipa') { renderEquipa(); return; }
  const { ini } = intervalo();
  const dias = vista === 'dia' ? 1 : 7;
  const hoje = isoLocal(new Date());
  const porDia = {};
  for (const f of itens) { const k = isoLocal(paraData(f.dataPrevista)); (porDia[k] = porDia[k] || []).push(f); }
  let html = '';
  for (let i = 0; i < dias; i++) {
    const d = addDias(ini, i);
    const k = isoLocal(d);
    const lista = porDia[k] || [];
    const fimDeSemana = d.getDay() === 0 || d.getDay() === 6;
    if (vista === 'semana' && fimDeSemana && !lista.length) continue;
    if (vista === 'semana') html += `<div class="dia-cab ${k === hoje ? 'hoje' : ''}"><span>${esc(fmtDiaSemana(d))}</span><span class="muted">${lista.length || ''}</span></div>`;
    html += lista.length ? lista.map((f) => cartao(f)).join('') : `<div class="vazio" style="padding:${vista === 'dia' ? 28 : 8}px">Sem trabalhos agendados.</div>`;
  }
  $('#lista').innerHTML = html;
}

const abrirCartao = (ev) => {
  if (ev.target.closest('[data-ext]') || ev.target.closest('[data-mover]')) return;
  const it = ev.target.closest('[data-id]');
  if (it) location.href = pagina('folhas', { id: it.dataset.id });
};
$('#lista').addEventListener('click', abrirCartao);
$('#atrasos').addEventListener('click', abrirCartao);
$$('#segVista button').forEach((b) => b.onclick = () => {
  vista = b.dataset.v;
  try { localStorage.setItem('agenda.vista', vista); } catch (e) { /* sem storage */ }
  carregar();
});
$('#mostrarConcl').checked = mostrarConcl;
$('#mostrarConcl').onchange = () => {
  mostrarConcl = $('#mostrarConcl').checked;
  try { localStorage.setItem('agenda.concluidas', mostrarConcl ? '1' : '0'); } catch (e) { /* sem storage */ }

};
$('#ant').onclick = () => { base = addDias(base, vista === 'semana' ? -7 : -1); carregar(); };
$('#seg').onclick = () => { base = addDias(base, vista === 'semana' ? 7 : 1); carregar(); };

$('#btnMais').onclick = () => comBotao($('#btnMais'), () => carregar(true));

carregar();

// ===== módulo: agenda.equipa.js =====
// Vista «Equipa» da agenda (Master/backoffice): o dia de cada técnico numa grelha horária, com blocos do tamanho
// da duração prevista e a ocupação de cada um. Mover/agendar: arrastar (computador) ou botão ⇄ / «Agendar» (telemóvel).
// As folhas «Por agendar» aparecem por baixo e podem ser arrastadas para a grelha.
const EQ_H0 = 7, EQ_H1 = 20, EQ_PX = 44, EQ_JORNADA = 8;
let eqPorAgendar = null;   // lido uma vez por visita (só a pedido da vista Equipa)

function duracaoDe(f) { return Number(f.duracaoPrevista) || duracaoTipo(f.tipo); }
function horaDecimal(d) { const x = paraData(d); return x.getHours() + x.getMinutes() / 60; }

async function colunasEquipa() {
  const tecs = await carregarTecnicos().catch(() => []);
  const cols = tecs.map((t) => ({ uid: t.uid, nome: t.nome }));
  for (const f of itens) if (f.tecnicoUid && !cols.some((c) => c.uid === f.tecnicoUid)) cols.push({ uid: f.tecnicoUid, nome: f.tecnicoNome || 'Sem nome', externo: true });
  if (itens.some((f) => !f.tecnicoUid)) cols.push({ uid: '', nome: 'Por atribuir' });
  return cols;
}

async function renderEquipa() {
  const box = $('#equipa');
  const [cols] = await Promise.all([colunasEquipa(), duracaoSugerida('', 'AT')]);
  const horas = [];
  for (let h = EQ_H0; h < EQ_H1; h++) horas.push(h);
  const altura = (EQ_H1 - EQ_H0) * EQ_PX;
  const colHtml = cols.map((c) => {
    const l = itens.filter((f) => (f.tecnicoUid || '') === c.uid).sort((a, b) => horaDecimal(a.dataPrevista) - horaDecimal(b.dataPrevista));
    // faixas para trabalhos sobrepostos
    const fins = [];
    const pos = l.map((f) => {
      const ini = horaDecimal(f.dataPrevista), fim = ini + duracaoDe(f);
      let faixa = fins.findIndex((x) => x <= ini + 0.001);
      if (faixa < 0) { faixa = fins.length; fins.push(fim); } else fins[faixa] = fim;
      return { f, ini, fim, faixa };
    });
    const nf = Math.max(1, fins.length);
    const ocup = l.reduce((s, f) => s + duracaoDe(f), 0);
    const blocos = pos.map(({ f, ini, faixa }) => {
      const top = Math.max(0, (ini - EQ_H0) * EQ_PX);
      const h = Math.max(24, Math.min(altura - top, duracaoDe(f) * EQ_PX) - 2);
      const est = classeEstado(f.estado).replace('estado-', 'b-');
      return `<div class="eq-bloco ${est}" data-id="${esc(f.id)}" draggable="true" style="top:${top}px;height:${h}px;left:calc(${(100 / nf) * faixa}% + 2px);width:calc(${100 / nf}% - 4px)"
        title="${esc(f.numero + ' · ' + f.clienteNome)}">
        <b>${esc(fmtHora(f.dataPrevista))}</b> ${esc(f.clienteNome)}<br><span>${esc(f.localidade || '')} · ${esc(fmtHorasD(duracaoDe(f)))}${f.duracaoPrevista ? '' : ' (est.)'}</span>
        <button class="eq-mover" data-mover="${esc(f.id)}" aria-label="Mover">⇄</button></div>`;
    }).join('');
    return `<div class="eq-coluna" data-tec="${esc(c.uid)}">
      <div class="eq-cab"><b>${esc(c.nome)}</b><span class="${ocup > EQ_JORNADA ? 'txt-erro' : 'muted'}">${esc(fmtHorasD(ocup))} / ${EQ_JORNADA} h</span></div>
      <div class="eq-corpo" data-tec="${esc(c.uid)}" style="height:${altura}px;background-size:100% ${EQ_PX}px">${blocos}</div></div>`;
  }).join('');
  box.innerHTML = `<div class="eq-wrap"><div class="eq-grade">
      <div class="eq-horas"><div class="eq-cab"></div><div style="height:${altura}px;position:relative">${horas.map((h) => `<span style="top:${(h - EQ_H0) * EQ_PX}px">${h}h</span>`).join('')}</div></div>
      ${colHtml}</div></div>
    <p class="muted" style="margin:6px 4px 12px;font-size:.85rem">Arraste um trabalho para outra hora ou técnico (no telemóvel use ⇄). Duração «est.» = duração real habitual do tipo (PHC).</p>
    <div class="cartao" id="eqPorAgendar"><h3 style="margin-top:0">Por agendar</h3><div class="vazio">A carregar…</div></div>`;
  carregarPorAgendar();
}

async function carregarPorAgendar() {
  try {
    if (!eqPorAgendar) {
      const snap = await getDocs(query(collection(db, 'folhas'), where('estado', '==', 'Por agendar'), orderBy('criadoEm', 'desc'), limit(20)));
      eqPorAgendar = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    }
    const box = $('#eqPorAgendar');
    if (!box) return;
    box.innerHTML = `<h3 style="margin-top:0">Por agendar <span class="muted">${eqPorAgendar.length}${eqPorAgendar.length === 20 ? '+' : ''}</span></h3>` + (eqPorAgendar.length
      ? eqPorAgendar.map((f) => `<div class="eq-pa lista-item b-por-agendar" draggable="true" data-pa="${esc(f.id)}">
          <div><b>${esc(f.numero)}</b> · ${esc(f.clienteNome)}<div class="muted">${esc(TIPO_NOME[f.tipo] || f.tipo)} · ${esc(f.localidade || '')}${f.dataPrevista ? ' · sugerido ' + esc(fmtData(f.dataPrevista)) : ''}${f.tecnicoNome ? ' · ' + esc(f.tecnicoNome) : ''}</div></div>
          <button class="btn btn-peq btn-primario" data-agendar="${esc(f.id)}">Agendar</button></div>`).join('')
      : '<p class="muted" style="margin:0">Nada por agendar.</p>');
  } catch (e) { const b = $('#eqPorAgendar'); if (b) b.innerHTML = `<p class="msg-erro">${esc(erroFirebase(e))}</p>`; }
}

const eqFolha = (id) => itens.find((f) => f.id === id) || (eqPorAgendar || []).find((f) => f.id === id);

// arrastar (computador): blocos e cartões «Por agendar» → coluna do técnico, à hora onde se larga (de 15 em 15 min)
$('#equipa').addEventListener('dragstart', (ev) => {
  const el = ev.target.closest('[data-id],[data-pa]');
  if (!el) return;
  ev.dataTransfer.setData('text/plain', el.dataset.id || el.dataset.pa);
  ev.dataTransfer.effectAllowed = 'move';
});
$('#equipa').addEventListener('dragover', (ev) => { if (ev.target.closest('.eq-corpo')) { ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; } });
$('#equipa').addEventListener('drop', (ev) => {
  const col = ev.target.closest('.eq-corpo');
  if (!col) return;
  ev.preventDefault();
  const f = eqFolha(ev.dataTransfer.getData('text/plain'));
  if (!f) return;
  const y = ev.clientY - col.getBoundingClientRect().top;
  const h = Math.min(EQ_H1 - 0.25, Math.max(EQ_H0, EQ_H0 + Math.round((y / EQ_PX) * 4) / 4));
  const quando = new Date(base);
  quando.setHours(Math.floor(h), Math.round((h % 1) * 60), 0, 0);
  moverFolha(f, { tecUid: col.dataset.tec, quando });
});
$('#equipa').addEventListener('click', (ev) => {
  const m = ev.target.closest('[data-mover],[data-agendar]');
  if (m) { ev.stopPropagation(); const f = eqFolha(m.dataset.mover || m.dataset.agendar); if (f) moverFolha(f, {}); return; }
  const b = ev.target.closest('.eq-bloco,[data-pa]');
  if (b) location.href = pagina('folhas', { id: b.dataset.id || b.dataset.pa });
});

// confirmação (e escolha no telemóvel): técnico, dia, hora, duração e aviso ao cliente
async function moverFolha(f, { tecUid, quando }) {
  const tecs = await carregarTecnicos().catch(() => []);
  const agendar = f.estado === 'Por agendar';
  const q = quando || (f.dataPrevista ? paraData(f.dataPrevista) : (() => { const d = new Date(base); d.setHours(9, 0, 0, 0); return d; })());
  const tSel = tecUid !== undefined && tecUid !== '' ? tecUid : (f.tecnicoUid || '');
  const sug = await duracaoSugerida(f.clienteId, f.tipo);
  const dur = Number(f.duracaoPrevista) || sug.h;
  const c = abrirModal(agendar ? 'Agendar ' + f.numero : 'Mover ' + f.numero, `
    <p style="margin-top:0"><b>${esc(f.clienteNome)}</b><br><span class="muted">${esc(TIPO_NOME[f.tipo] || f.tipo)} · ${esc([f.morada, f.localidade].filter(Boolean).join(', '))}</span></p>
    <label class="campo"><span>Técnico *</span><select id="mTec"><option value="">Escolher…</option>${tecs.map((t) => `<option value="${esc(t.uid)}" ${t.uid === tSel ? 'selected' : ''}>${esc(t.nome)}</option>`).join('')}
      ${tSel && !tecs.some((t) => t.uid === tSel) ? `<option value="${esc(tSel)}" selected>${esc(f.tecnicoNome || tSel)}</option>` : ''}</select></label>
    <div class="linha2">
      <label class="campo"><span>Dia *</span><input type="date" id="mData" value="${isoLocal(q)}"></label>
      <label class="campo"><span>Hora *</span><input type="time" id="mHora" step="900" value="${String(q.getHours()).padStart(2, '0')}:${String(q.getMinutes()).padStart(2, '0')}"></label>
    </div>
    <label class="campo"><span>Duração prevista (h)</span><input type="number" id="mDur" min="0.5" max="200" step="0.5" inputmode="decimal" value="${esc(String(dur))}">
      <small class="muted">${esc(sug.fonte === 'cliente' ? `Real neste cliente: ${fmtHorasD(sug.h)} (${sug.n} intervenções)` : sug.fonte === 'tipo' ? `Real deste tipo: ${fmtHorasD(sug.h)} (${sug.n} intervenções)` : `Habitual: ${fmtHorasD(sug.h)}`)}</small></label>
    <label class="campo"><span>Avisar o cliente por email</span><input type="email" id="mEmail" inputmode="email" autocomplete="off" value="${esc(emailDoCliente(f))}" placeholder="email@cliente.pt"></label>
    <label class="campo" style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="mSem" style="width:auto;min-height:0"><span style="margin:0">Não enviar aviso desta vez</span></label>
    <div class="msg-erro" id="mErro"></div>
    <div class="acoes"><button class="btn" data-fechar>Cancelar</button><button class="btn btn-primario" id="mOk">${agendar ? 'Agendar' : 'Mover'}</button></div>`);
  $('#mOk', c).onclick = () => {
    const erro = (m) => { $('#mErro', c).textContent = m; };
    const uid = $('#mTec', c).value;
    if (!uid) return erro('Escolha o técnico.');
    if (!$('#mData', c).value || !$('#mHora', c).value) return erro('Indique o dia e a hora.');
    const [hh, mm] = $('#mHora', c).value.split(':').map(Number);
    const d = deIsoLocal($('#mData', c).value); d.setHours(hh, mm, 0, 0);
    const duracao = Math.max(0, Math.min(200, Number(String($('#mDur', c).value).replace(',', '.')) || 0));
    const sem = $('#mSem', c).checked;
    const para = $('#mEmail', c).value.trim();
    if (!sem && !emailValido(para)) return erro('Indique o email do cliente, ou marque «Não enviar aviso desta vez».');
    const nome = (tecs.find((t) => t.uid === uid) || {}).nome || f.tecnicoNome || '';
    comBotao($('#mOk', c), async () => {
      try {
        await gravarMovimento(f, { uid, nome, quando: d, duracao, avisoPara: sem ? '' : para });
        fecharModal();
        toast(`${f.numero} ${agendar ? 'agendada' : 'movida'} para ${fmtDiaSemana(d)}, ${fmtHora(Timestamp.fromDate(d))}${sem ? '' : ' · aviso a enviar para ' + para}.`, 'ok', 5000);
        if (agendar) eqPorAgendar = null;
        carregar();
      } catch (e) { erro(erroFirebase(e)); }
    });
  };
}

async function gravarMovimento(f, { uid, nome, quando, duracao, avisoPara }) {
  const ref = doc(db, 'folhas', f.id);
  await runTransaction(db, async (tx) => {
    const s = await tx.get(ref);
    const d = s.data();
    if (!['Por agendar', 'Agendada'].includes(d.estado)) throw Object.assign(new Error(`${f.numero} já está «${d.estado}»: abra a folha para a alterar.`), { code: 'estado' });
    const alt = { dataPrevista: Timestamp.fromDate(quando), tecnicoUid: uid, tecnicoNome: nome, atualizadoEm: serverTimestamp(), atualizadoPor: sessao.uid };
    if (duracao) alt.duracaoPrevista = duracao;
    if (d.estado === 'Por agendar') {
      alt.estado = 'Agendada';
      alt.historico = [...(d.historico || []), { estado: 'Agendada', de: d.estado, uid: sessao.uid, nome: sessao.nome || sessao.email, em: Timestamp.now() }];
      alt.estadoAlteradoEm = serverTimestamp();
    }
    if (avisoPara) {
      const eRef = doc(collection(db, 'emails'));
      tx.set(eRef, dadosEmailAgendamento({ id: f.id, ...d, ...alt, dataPrevista: alt.dataPrevista }, avisoPara, d.estado !== 'Por agendar'));
      alt.avisoAgendamento = { para: avisoPara, emailId: eRef.id, pedidoEm: Timestamp.now(), uid: sessao.uid };
    }
    tx.update(ref, alt);
  });
}

// ===== módulo: folhas.aviso.js =====
// Aviso de agendamento/reagendamento ao cliente (email pela PontePHC). Partilhado pelas páginas Folhas e Agenda.
function emailValido(e) { return /^[^@\s,;]+@[^@\s,;]+\.[^@\s,;]+$/.test(String(e || '').trim()); }
function emailDoCliente(f) { return (f.emailContacto || f.clienteEmail || '').trim(); }
function pedirAvisoAgendamento(f, reagendar = false) {
  return new Promise((resolve) => {
    const em = emailDoCliente(f);
    const c = abrirModal(reagendar ? 'Reagendar' : 'Agendar', `
      <p style="margin-top:0">${esc(TIPO_NOME[f.tipo] || f.tipo)} · ${f.dataPrevista ? `<b>${esc(fmtDiaSemana(paraData(f.dataPrevista)))}, ${esc(fmtHora(f.dataPrevista))}</b>` : ''} · ${esc(f.tecnicoNome || '')}</p>
      <label class="campo"><span>Enviar aviso ao cliente para</span><input id="aEmail" type="email" inputmode="email" autocomplete="off" value="${esc(em)}" placeholder="email@cliente.pt"></label>
      <label class="campo" style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="aSem" style="width:auto;min-height:0"><span style="margin:0">Não enviar aviso desta vez</span></label>
      <div class="msg-erro" id="aErro"></div>
      <div class="acoes"><button class="btn" data-fechar>Cancelar</button><button class="btn btn-primario" id="aOk">${reagendar ? 'Reagendar' : 'Agendar'}</button></div>`,
    { aoFechar: () => resolve(null) });
    $('#aOk', c).onclick = () => {
      if ($('#aSem', c).checked) { fecharModal(); resolve(''); return; }
      const para = $('#aEmail', c).value.trim();
      if (!emailValido(para)) { $('#aErro', c).textContent = 'Indique o email do cliente, ou marque «Não enviar aviso desta vez».'; return; }
      fecharModal();
      resolve(para);
    };
  });
}
function avisoAgendamentoHtml(f, reagendar) {
  const e = esc;
  const quando = f.dataPrevista ? `${fmtDiaSemana(paraData(f.dataPrevista))}, às ${fmtHora(f.dataPrevista)}` : '';
  return `<div style="font-family:Arial,Helvetica,sans-serif;color:#0f172a;max-width:680px;margin:0 auto">
  ${cabecalhoEmail((reagendar ? 'Intervenção reagendada' : 'Intervenção agendada') + ' · ' + f.numero)}
  <div style="padding:16px 18px;font-size:14px">
  <p style="margin:0 0 12px">Informamos que a intervenção ${reagendar ? 'foi reagendada' : 'está agendada'} para <b>${e(quando)}</b> (hora prevista de chegada).</p>
  <table style="font-family:Arial,Helvetica,sans-serif;border-collapse:collapse;font-size:14px">
    <tr><td style="font-family:Arial,Helvetica,sans-serif;padding:3px 8px 3px 0;color:#64748b">Cliente</td><td>${e(f.clienteNome)}</td></tr>
    <tr><td style="font-family:Arial,Helvetica,sans-serif;padding:3px 8px 3px 0;color:#64748b">Local</td><td>${e([f.morada, [f.codigoPostal, f.localidade].filter(Boolean).join(' ')].filter(Boolean).join(', '))}</td></tr>
    <tr><td style="font-family:Arial,Helvetica,sans-serif;padding:3px 8px 3px 0;color:#64748b">Tipo</td><td>${e(TIPO_NOME[f.tipo] || f.tipo)}</td></tr>
    <tr><td style="font-family:Arial,Helvetica,sans-serif;padding:3px 8px 3px 0;color:#64748b">Técnico</td><td>${e(f.tecnicoNome || '')}</td></tr>
    ${f.descricao ? `<tr><td style="font-family:Arial,Helvetica,sans-serif;padding:3px 8px 3px 0;color:#64748b;vertical-align:top">Trabalho</td><td style="white-space:pre-wrap">${e(f.descricao)}</td></tr>` : ''}
  </table>
  <p style="margin:14px 0 0">Se esta data não for conveniente, responda a este email para combinarmos outra.</p>
  <p style="margin:18px 0 0;font-size:12px;color:#64748b">ARPURO &amp; REDEMÓVEL, LDA · NIF 503198749 · São João da Madeira</p>
  </div></div>`;
}
function dadosEmailAgendamento(f, para, reagendar = false) {
  const quando = f.dataPrevista ? `${fmtDiaSemana(paraData(f.dataPrevista))}, às ${fmtHora(f.dataPrevista)}` : '';
  return {
    tipo: 'agendamento', estado: 'Pendente', para: para.trim(), folhaId: f.id, folhaNumero: f.numero,
    assunto: `${reagendar ? 'Intervenção reagendada' : 'Intervenção agendada'} ${f.numero} — ${quando} — Arpuro Climatização`,
    html: avisoAgendamentoHtml(f, reagendar),
    texto: `Arpuro Climatização — ${reagendar ? 'intervenção reagendada' : 'intervenção agendada'} ${f.numero}\n\nData prevista: ${quando}\nCliente: ${f.clienteNome}\nTécnico: ${f.tecnicoNome || ''}\n${f.descricao ? 'Trabalho: ' + f.descricao + '\n' : ''}\nSe esta data não for conveniente, responda a este email.`,
    assinaturaPng: '', criadoPor: sessao.uid, criadoPorNome: sessao.nome || sessao.email, criadoEm: serverTimestamp(),
  };
}
