// NIF: português com dígito de controlo; estrangeiro com indicativo do país (ex.: ES B12345678).
function validarNIF(entrada) {
  const v = String(entrada || '').toUpperCase().replace(/[\s.\-/]/g, '');
  if (!v) return { ok: false, erro: 'O NIF é obrigatório.' };
  const pt = v.startsWith('PT') ? v.slice(2) : v;
  if (/^\d+$/.test(pt)) {
    if (pt.length !== 9) return { ok: false, erro: 'O NIF português tem 9 dígitos.' };
    if (!/^([1235689]|45|7[0-9])/.test(pt)) return { ok: false, erro: 'NIF português com início inválido.' };
    let soma = 0;
    for (let i = 0; i < 8; i++) soma += Number(pt[i]) * (9 - i);
    let ctrl = 11 - (soma % 11);
    if (ctrl >= 10) ctrl = 0;
    if (ctrl !== Number(pt[8])) return { ok: false, erro: 'NIF inválido (dígito de controlo errado).' };
    return { ok: true, nif: pt, pais: 'PT' };
  }
  const m = v.match(/^([A-Z]{2})([A-Z0-9]{2,13})$/);
  if (m && m[1] !== 'PT' && /\d/.test(m[2])) return { ok: true, nif: v, pais: m[1] };
  return { ok: false, erro: 'NIF inválido. Estrangeiro: indicativo do país + número (ex.: ES B12345678).' };
}

// ---------- Pesquisa de clientes ----------
// Cada cliente guarda `pesquisa`: prefixos (2+ letras) de cada palavra do nome e da localidade.
// Assim "hot" encontra "Hotel Meliá" e "meli" também, com uma só consulta (array-contains).
const normalizar = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function tokensPesquisa(...textos) {
  const set = new Set();
  for (const t of textos) {
    for (const p of normalizar(t).split(/[^a-z0-9]+/)) {
      for (let i = 2; i <= Math.min(p.length, 15); i++) set.add(p.slice(0, i));
    }
  }
  return [...set];
}

async function pesquisarClientes(texto, { soAtivos = false } = {}) {
  const t = String(texto || '').trim();
  const n = validarNIF(t);
  const palavras = normalizar(t).split(/[^a-z0-9]+/).filter((p) => p.length >= 2).map((p) => p.slice(0, 15));
  let docs = [];
  if (n.ok) {
    docs = (await getDocs(query(collection(db, 'clientes'), where('nif', '==', n.nif), limit(10)))).docs;
  } else {
    const consultas = [];
    if (palavras.length) {
      const chave = palavras.reduce((a, b) => (b.length > a.length ? b : a));
      consultas.push(getDocs(query(collection(db, 'clientes'), where('pesquisa', 'array-contains', chave), limit(PAGINA_TAM)))
        .then((sn) => sn.docs.filter((d) => palavras.every((p) => (d.data().pesquisa || []).includes(p)))));
    }
    // início do nome, também para siglas («M. D.», «MDA» → «m. d. a. - moldes…» / «m.d.a.»)
    for (const pre of prefixosNome(t)) {
      consultas.push(getDocs(query(collection(db, 'clientes'), orderBy('nomePesquisa'), startAt(pre), endAt(pre + '\uf8ff'), limit(PAGINA_TAM))).then((sn) => sn.docs));
    }
    const vistos = new Set();
    for (const l of await Promise.all(consultas)) for (const d of l) if (!vistos.has(d.id)) { vistos.add(d.id); docs.push(d); }
  }
  return docs.map((d) => ({ id: d.id, ...d.data() }))
    .filter((c) => !soAtivos || c.ativo !== false)
    .sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt'));
}
function prefixosNome(t) {
  const base = normalizar(t).replace(/\s+/g, ' ').trim();
  if (base.length < 2) return [];
  const l = new Set([base]);
  const letras = base.replace(/[^a-z0-9]/g, '');
  // parece uma sigla: letras soltas com pontos/espaços, ou uma palavra curta
  if (letras.length >= 2 && letras.length <= 5 && (/^([a-z0-9][. ]*)+$/.test(base) && (base.includes('.') || base.includes(' ') || letras.length <= 4))) {
    const c = letras.split('');
    l.add(c.join('. ') + '.'); l.add(c.join('.') + '.'); l.add(c.join(' '));
  }
  return [...l].slice(0, 4);
}

// ---------- Artigos (stock do armazém da climatização, vindo do PHC) ----------
// disponível = stock − reservado em FO abertas no PHC − ainda em guias abertas no PHC
//              − reservado em folhas da plataforma − em guias abertas da plataforma
const r3 = (n) => Math.round((Number(n) || 0) * 1000) / 1000;
function disponivel(a) {
  return r3((a.stock || 0) - (a.reservadoPHC || 0) - (a.emGuiasPHC || 0) - (a.resFolhas || 0) - (a.resGuias || 0));
}
const fmtQtd = (n) => r3(n).toLocaleString('pt-PT', { maximumFractionDigits: 3 });
async function pesquisarArtigos(texto) {
  const palavras = normalizar(texto).split(/[^a-z0-9]+/).filter((p) => p.length >= 2).map((p) => p.slice(0, 15));
  if (!palavras.length) return [];
  const chave = palavras.reduce((a, b) => (b.length > a.length ? b : a));
  const snap = await getDocs(query(collection(db, 'artigos'), where('pesquisa', 'array-contains', chave), limit(PAGINA_TAM)));
  return snap.docs.map((d) => ({ id: d.id, ...d.data() }))
    .filter((a) => a.ativo !== false && palavras.every((p) => (a.pesquisa || []).includes(p)))
    .sort((a, b) => disponivel(b) - disponivel(a) || (a.ref || '').localeCompare(b.ref || ''));
}
// Acumula movimentos de reserva por artigo e aplica-os dentro de uma transação (lê primeiro, escreve depois).
// mov: { artigoId: { resFolhas: +x, resGuias: -y } }; exigeDisponivel: artigos que não podem ficar negativos.
async function aplicarReservas(tx, mov, exigeDisponivel = new Set()) {
  const ids = Object.keys(mov);
  const docs = {};
  for (const id of ids) {
    const s = await tx.get(doc(db, 'artigos', id));
    if (!s.exists()) throw Object.assign(new Error('Artigo não encontrado: ' + id), { code: 'artigo' });
    docs[id] = s.data();
  }
  return () => {
    for (const id of ids) {
      const a = docs[id];
      const novo = { resFolhas: r3((a.resFolhas || 0) + (mov[id].resFolhas || 0)), resGuias: r3((a.resGuias || 0) + (mov[id].resGuias || 0)) };
      if (novo.resFolhas < 0) novo.resFolhas = 0;
      if (novo.resGuias < 0) novo.resGuias = 0;
      if (exigeDisponivel.has(id) && disponivel({ ...a, ...novo }) < -0.0005) {
        throw Object.assign(new Error(`Sem stock disponível de ${a.ref} (disponível: ${fmtQtd(disponivel(a))} ${a.unidade || ''}).`), { code: 'stock' });
      }
      tx.update(doc(db, 'artigos', id), { ...novo, resAtualizadoEm: serverTimestamp() });
    }
  };
}
// N.º de série → id do documento em series/ (maiúsculas, sem espaços; «/» e outros trocados por ~XX)
function idSerie(sr) {
  return String(sr || '').toUpperCase().replace(/\s+/g, '').replace(/[^A-Z0-9._-]/g, (c) => '~' + c.charCodeAt(0).toString(16).toUpperCase().padStart(2, '0'));
}
function limparSerie(sr) { return String(sr || '').trim().toUpperCase().replace(/\s+/g, ''); }

// Ao faturar/anular uma folha, o material dela deixa de estar reservado na plataforma.
function movLibertarFolha(f) {
  const mov = {};
  for (const m of f.materiais || []) if (m.artigoId) (mov[m.artigoId] = mov[m.artigoId] || { resFolhas: 0 }).resFolhas -= Number(m.qtd) || 0;
  return mov;
}

// ---------- «Sincronizar com o PHC agora» (staff): a PontePHC vê o pedido em ~30 s e corre um ciclo completo ----------
async function pedirSincronizacao(btn, aoConcluir) {
  await comBotao(btn, async () => {
    const ref = doc(db, 'controlo', 'sincronizar');
    try {
      await setDoc(ref, { estado: 'Pedido', pedidoEm: serverTimestamp(), pedidoPor: SESSAO.uid, pedidoPorNome: SESSAO.nome || SESSAO.email });
    } catch (e) { toast(erroFirebase(e), 'erro'); return; }
    toast('Pedido enviado ao servidor. A sincronização demora 1 a 2 minutos…', 'ok', 6000);
    for (let i = 0; i < 24; i++) {   // até 4 minutos, uma leitura a cada 10 s
      await new Promise((r) => setTimeout(r, 10000));
      let d;
      try { d = (await getDoc(ref)).data() || {}; } catch (e) { continue; }
      if (d.estado === 'Concluído') {
        toast('Sincronização com o PHC concluída' + (d.resultado && d.resultado !== 'OK' ? ': ' + d.resultado : '.'), d.resultado === 'OK' ? 'ok' : 'erro', 6000);
        if (aoConcluir) aoConcluir();
        return;
      }
    }
    toast('O servidor ainda não respondeu. Confirme que o serviço PontePHC está a correr.', 'erro', 8000);
  });
}

// ---------- Folhas de obra: criação (partilhada pela página Folhas e pela geração dos contratos) ----------
// Prefixos para a pesquisa (n.º, cliente, NIF, avaria) — iguais aos que a PontePHC grava nas folhas do PHC.
function tokensFolha(numero, clienteNome, nif, descricao) {
  const n = String(numero || '');
  return tokensPesquisa(n, n.split('-').pop().replace(/^0+/, ''), clienteNome, String(nif || '').replace(/\D/g, ''), descricao).slice(0, 400);
}
// Numeração FO-AAAA-NNNN no contador do ano; toda a folha nova nasce «Por agendar». extraTx(tx, fRef, numero) corre na mesma transação.
async function criarFolhaNova(cliente, dados, extraTx = null) {
  const ano = new Date().getFullYear();
  const cRef = doc(db, 'contadores', 'folhas-' + ano);
  const fRef = doc(collection(db, 'folhas'));
  let numero = '';
  await runTransaction(db, async (tx) => {
    const c = await tx.get(cRef);
    const pre = extraTx ? await extraTx(tx, null, null) : null;   // leituras extra (antes das escritas)
    const n = (c.exists() ? c.data().valor : 0) + 1;
    numero = `FO-${ano}-${String(n).padStart(4, '0')}`;
    tx.set(cRef, { valor: n });
    tx.set(fRef, {
      ...dados,
      numero,
      clienteId: cliente.id, clienteNome: cliente.nome, clienteNif: cliente.nif || '', clienteEmail: dados.clienteEmail || cliente.email || '',
      pesquisa: tokensFolha(numero, cliente.nome, cliente.nif, dados.descricao),
      estado: 'Por agendar',
      historico: [{ estado: 'Por agendar', de: null, uid: SESSAO.uid, nome: SESSAO.nome || SESSAO.email, em: Timestamp.now(), ...(dados.contratoId ? { nota: 'Gerada pelo contrato ' + dados.contratoNumero } : {}) }],
      observacoesTecnico: '',
      criadoEm: serverTimestamp(), criadoPor: SESSAO.uid, criadoPorNome: SESSAO.nome || SESSAO.email,
      estadoAlteradoEm: serverTimestamp(),
    });
    if (pre) pre(fRef, numero);
  });
  return fRef.id;
}

// ---------- Contratos de manutenção ----------
const PERIODICIDADES = { Mensal: 1, Bimestral: 2, Trimestral: 3, Semestral: 6, Anual: 12 };
function addMeses(d, n) {
  const x = new Date(d);
  const dia = x.getDate();
  x.setDate(1); x.setMonth(x.getMonth() + n);
  const ult = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate();
  x.setDate(Math.min(dia, ult));
  return x;
}
// Quando gerar a folha da visita: «antecedência» dias antes da data da visita.
function dataGeracao(proxima, antecedencia) { return addDias(inicioDia(proxima), -(Number(antecedencia) || 0)); }
function descricaoVisita(ct) {
  const eq = (ct.equipamentos || []).map((e) => [e.descricao, e.marca, e.serie ? 'n.º ' + e.serie : '', e.local].filter(Boolean).join(' · '));
  return [`Manutenção ${String(ct.periodicidade || '').toLowerCase()} — contrato ${ct.numero}.`, ct.ambito || '', eq.length ? 'Equipamentos:\n- ' + eq.join('\n- ') : '']
    .filter(Boolean).join('\n');
}
// Gera a folha da próxima visita de um contrato e avança a próxima data, numa só transação (nunca duplica).
async function gerarVisitaContrato(ctId, { forcar = false } = {}) {
  const ctRef = doc(db, 'contratos', ctId);
  const ct0 = (await getDoc(ctRef)).data();
  if (!ct0 || ct0.estado !== 'Ativo' || !ct0.proximaData) return null;
  const prox = paraData(ct0.proximaData);
  if (!forcar && dataGeracao(prox, ct0.antecedenciaDias) > new Date()) return null;
  if (ct0.dataFim && prox > paraData(ct0.dataFim) && !ct0.renovacaoAutomatica) return null;
  const [h, m] = String(ct0.horaPreferida || '09:00').split(':').map(Number);
  const quando = new Date(prox); quando.setHours(h || 9, m || 0, 0, 0);
  const cliente = { id: ct0.clienteId, nome: ct0.clienteNome, nif: ct0.clienteNif || '', email: ct0.clienteEmail || '' };
  const dados = {
    tipo: 'Manutenção', tecnicoUid: ct0.tecnicoUid || '', tecnicoNome: ct0.tecnicoNome || '',
    dataPrevista: Timestamp.fromDate(quando), duracaoPrevista: Number(ct0.duracaoPrevista) || 0,
    morada: ct0.morada || '', codigoPostal: ct0.codigoPostal || '', localidade: ct0.localidade || '', contacto: ct0.contacto || '', telefone: ct0.telefone || '',
    descricao: descricaoVisita(ct0), tarefasExtra: (ct0.tarefas || []).slice(0, 30),
    origem: 'contrato', contratoId: ctId, contratoNumero: ct0.numero, atualizadoEm: serverTimestamp(), atualizadoPor: SESSAO.uid,
  };
  let gerada = null;
  const id = await criarFolhaNova(cliente, dados, async (tx) => {
    const s = await tx.get(ctRef);
    const ct = s.data();
    // outro utilizador gerou entretanto?
    if (!ct || ct.estado !== 'Ativo' || !ct.proximaData || paraData(ct.proximaData).getTime() !== prox.getTime()) throw Object.assign(new Error('já gerada'), { code: 'ja-gerada' });
    return (fRef, numero) => {
      let nova = addMeses(prox, PERIODICIDADES[ct.periodicidade] || 12);
      const alt = { proximaData: Timestamp.fromDate(nova), geracaoEm: Timestamp.fromDate(dataGeracao(nova, ct.antecedenciaDias)),
        ultimaVisita: Timestamp.fromDate(prox), atualizadoEm: serverTimestamp(), atualizadoPor: SESSAO.uid,
        folhas: [{ folhaId: fRef.id, numero, data: Timestamp.fromDate(quando) }, ...(ct.folhas || [])].slice(0, 24) };
      // fim do contrato: renova por mais um ano, ou deixa de gerar
      if (ct.dataFim && nova > paraData(ct.dataFim)) {
        if (ct.renovacaoAutomatica) alt.dataFim = Timestamp.fromDate(addMeses(paraData(ct.dataFim), 12));
        else alt.geracaoEm = Timestamp.fromDate(new Date(2999, 0, 1));
      }
      tx.update(ctRef, alt);
      gerada = numero;
    };
  }).catch((e) => { if (e.code === 'ja-gerada') return null; throw e; });
  return id ? { id, numero: gerada } : null;
}
// Gera todas as visitas em falta (contratos ativos com data de geração já passada). Corre ao abrir as páginas (staff), no máx. 1 vez por hora neste aparelho.
async function gerarManutencoesPendentes({ forcar = false } = {}) {
  if (!ehStaff(SESSAO.perfil)) return [];
  const chave = 'manut.ultima.' + SESSAO.uid;
  try { if (!forcar && Date.now() - Number(localStorage.getItem(chave) || 0) < 3600e3) return []; } catch (e) { /* sem storage */ }
  const feitas = [];
  try {
    for (let volta = 0; volta < 3; volta++) {   // até 3 visitas em atraso por contrato
      const snap = await getDocs(query(collection(db, 'contratos'), where('estado', '==', 'Ativo'), where('geracaoEm', '<=', Timestamp.now()), orderBy('geracaoEm'), limit(20)));
      if (snap.empty) break;
      let nesta = 0;
      for (const d of snap.docs) { const r = await gerarVisitaContrato(d.id); if (r) { feitas.push(r); nesta++; } }
      if (!nesta) break;
    }
    try { localStorage.setItem(chave, String(Date.now())); } catch (e) { /* sem storage */ }
  } catch (e) { console.warn('Contratos:', e); }
  return feitas;
}

// Lista de técnicos ativos (coleção pequena; lida uma vez por página).
let _tecnicos = null;
async function carregarTecnicos() {
  if (_tecnicos) return _tecnicos;
  const col = collection(db, 'utilizadores');
  const [a, b] = await Promise.all([
    getDocs(query(col, where('perfil', '==', 'tecnico'), where('ativo', '==', true), limit(50))),
    getDocs(query(col, where('tecnico', '==', true), where('ativo', '==', true), limit(50))),
  ]);
  const mapa = new Map();
  for (const d of [...a.docs, ...b.docs]) mapa.set(d.id, { uid: d.id, ...d.data() });
  _tecnicos = [...mapa.values()].sort((x, y) => (x.nome || '').localeCompare(y.nome || '', 'pt'));
  return _tecnicos;
}

async function carregarLista(mais = false) {
  if (!mais) { lista = []; cursor = null; $('#lista').innerHTML = '<div class="vazio">A carregar…</div>'; }
  const texto = $('#q').value.trim();
  const c = [where('estado', '==', $('#fEstado').value)];
  let palavras = [];
  if (texto) {
    palavras = normalizar(texto).split(/[^a-z0-9]+/).filter((p) => p.length >= 2).map((p) => p.slice(0, 15));
    if (palavras.length) c.push(where('pesquisa', 'array-contains', palavras.reduce((a, b) => (b.length > a.length ? b : a))));
  }
  c.push(orderBy(texto ? 'criadoEm' : 'proximaData', texto ? 'desc' : 'asc'));
  if (cursor) c.push(startAfter(cursor));
  c.push(limit(PAGINA_TAM));
  try {
    const snap = await getDocs(query(collection(db, 'contratos'), ...c));

    if (palavras.length) novos = novos.filter((x) => palavras.every((p) => (x.pesquisa || []).includes(p)));
    lista = lista.concat(novos);
    cursor = snap.docs[snap.docs.length - 1] || cursor;

async function mostrarValor() {
  try {
    const s = await getDoc(doc(db, 'contratos', atual.id, 'privado', 'valores'));
    const v = s.exists() ? s.data() : {};
    const n = 12 / (PERIODICIDADES[atual.periodicidade] || 12);
    $('#valorContrato').innerHTML = v.valorAnual ? `<p class="ok-at" style="margin:10px 0 0" id="valorAnual">Valor anual <b>${esc(eur(v.valorAnual))}</b> s/IVA · ${n} visitas/ano · ${esc(eur(v.valorAnual / n))} por visita <span class="muted">(só o Master vê)</span></p>` : '';
  } catch (e) { /* sem valor */ }
}
async function mudarEstadoContrato(novo, btn) {
  const msg = { Suspenso: 'Suspender o contrato? Deixam de ser geradas folhas até o reativar.', Ativo: 'Reativar o contrato?', Terminado: 'Terminar o contrato? Deixam de ser geradas folhas.' }[novo];
  if (!(await confirmar(msg, { ok: novo === 'Ativo' ? 'Reativar' : novo === 'Suspenso' ? 'Suspender' : 'Terminar', perigo: novo === 'Terminado' }))) return;
  await comBotao(btn, async () => {
    try {
      const alt = { estado: novo, atualizadoEm: serverTimestamp(), atualizadoPor: sessao.uid };
      // ao reativar, a próxima visita não pode ficar no passado
      if (novo === 'Ativo' && atual.proximaData && paraData(atual.proximaData) < inicioDia(new Date())) {
        let p = paraData(atual.proximaData);
        while (p < inicioDia(new Date())) p = addMeses(p, PERIODICIDADES[atual.periodicidade] || 12);
        alt.proximaData = Timestamp.fromDate(p);
        alt.geracaoEm = Timestamp.fromDate(dataGeracao(p, atual.antecedenciaDias));
      }
      await updateDoc(doc(db, 'contratos', atual.id), alt);
      toast('Contrato ' + novo.toLowerCase() + '.', 'ok');
      lista = [];
      abrirDetalhe(atual.id);
    } catch (e) { toast(erroFirebase(e), 'erro'); }
  });
}

// ---------- Formulário ----------
async function abrirForm(ct, clienteIdInicial) {
  const ed = !!ct;
  let cliente = ed ? { id: ct.clienteId, nome: ct.clienteNome, nif: ct.clienteNif, email: ct.clienteEmail, morada: ct.morada, codigoPostal: ct.codigoPostal, localidade: ct.localidade, contacto: ct.contacto, telefone: ct.telefone } : null;
  if (!cliente && clienteIdInicial) {
    try { const s = await getDoc(doc(db, 'clientes', clienteIdInicial)); if (s.exists()) cliente = { id: s.id, ...s.data() }; } catch (e) { /* ignora */ }
  }
  let valorAnual = '';
  if (ed && master) { try { const s = await getDoc(doc(db, 'contratos', ct.id, 'privado', 'valores')); if (s.exists()) valorAnual = s.data().valorAnual || ''; } catch (e) { /* */ } }
  if (!tecnicos.length) tecnicos = await carregarTecnicos().catch(() => []);
  const equip = (ct?.equipamentos || []).map((e) => ({ ...e }));
  const hoje = isoLocal(new Date());
  const c = abrirModal(ed ? 'Editar contrato' : 'Novo contrato de manutenção', `
    <div class="campo"><span>Cliente *</span><div id="cCliente"></div></div>
    <div class="grelha-2">
      <label class="campo"><span>Periodicidade *</span><select id="cPer">${Object.keys(PERIODICIDADES).map((p) => `<option ${ct?.periodicidade === p || (!ct && p === 'Trimestral') ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
      <label class="campo"><span>Próxima visita *</span><input type="date" id="cProx" value="${ct?.proximaData ? isoLocal(paraData(ct.proximaData)) : hoje}"></label>
    </div>
    <div class="grelha-2">
      <label class="campo"><span>Hora preferida</span><input type="time" id="cHora" value="${esc(ct?.horaPreferida || '09:00')}"></label>
      <label class="campo"><span>Duração prevista (h)</span><input type="number" id="cDur" min="0" step="0.5" inputmode="decimal" value="${esc(String(ct?.duracaoPrevista ?? 2))}"></label>
    </div>
    <div class="grelha-2">
      <label class="campo"><span>Técnico habitual</span><select id="cTec"><option value="">— por atribuir —</option>${tecnicos.map((t) => `<option value="${esc(t.uid)}" ${ct?.tecnicoUid === t.uid ? 'selected' : ''}>${esc(t.nome)}</option>`).join('')}</select></label>
      <label class="campo"><span>Gerar a folha (dias antes)</span><input type="number" id="cAnt" min="0" max="120" value="${esc(String(ct?.antecedenciaDias ?? 30))}"></label>
    </div>
    <div class="grelha-2">
      <label class="campo"><span>Início *</span><input type="date" id="cIni" value="${ct?.dataInicio ? isoLocal(paraData(ct.dataInicio)) : hoje}"></label>
      <label class="campo"><span>Fim</span><input type="date" id="cFim" value="${ct?.dataFim ? isoLocal(paraData(ct.dataFim)) : ''}"></label>
    </div>
    <label class="campo" style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="cRen" style="width:auto;min-height:0" ${ct?.renovacaoAutomatica !== false ? 'checked' : ''}><span style="margin:0">Renova automaticamente por mais um ano</span></label>
    <label class="campo"><span>Email do cliente (avisos e relatórios)</span><input type="email" id="cEmail" inputmode="email" autocomplete="off" value="${esc(ct?.clienteEmail || cliente?.email || '')}"></label>
    <label class="campo"><span>Âmbito do contrato</span><textarea id="cAmb" placeholder="Ex.: limpeza de filtros, verificação de pressões e drenagens, relatório">${esc(ct?.ambito || '')}</textarea></label>
    <div class="campo"><span>Equipamentos</span><div id="cEquip"></div><button type="button" class="btn btn-peq" id="cMaisEq" style="margin-top:6px">+ Equipamento</button></div>
    <label class="campo"><span>Tarefas de cada visita (uma por linha)</span><textarea id="cTar" placeholder="Limpeza de filtros\nVerificação de pressões\nLimpeza de condensadores">${esc((ct?.tarefas || []).join('\n'))}</textarea></label>
    ${master ? `<label class="campo"><span>Valor anual (€, s/IVA) — só o Master vê</span><input type="number" id="cValor" min="0" step="0.01" inputmode="decimal" value="${esc(String(valorAnual))}"></label>` : ''}
    <div class="msg-erro" id="cErro"></div>
    <div class="acoes"><button class="btn" data-fechar>Cancelar</button><button class="btn btn-primario" id="cGuardar">Guardar</button></div>`);
  const desenharCliente = () => {
    $('#cCliente', c).innerHTML = cliente
      ? `<div class="cliente-escolhido"><b>${esc(cliente.nome)}</b><br><span class="muted">${esc([cliente.morada, cliente.codigoPostal, cliente.localidade].filter(Boolean).join(', '))}</span>${ed ? '' : ' <button type="button" class="btn btn-peq" id="cTrocar">Trocar</button>'}</div>`
      : `<div style="display:flex;gap:8px"><input id="cCliProc" placeholder="Nome, NIF ou localidade" autocomplete="off"><button type="button" class="btn" id="cCliBtn">Procurar</button></div><div id="cCliRes"></div>`;
    if ($('#cTrocar', c)) $('#cTrocar', c).onclick = () => { cliente = null; desenharCliente(); };
    if ($('#cCliBtn', c)) $('#cCliBtn', c).onclick = () => comBotao($('#cCliBtn', c), async () => {
      const l = await pesquisarClientes($('#cCliProc', c).value, { soAtivos: true }).catch((e) => { toast(erroFirebase(e), 'erro'); return []; });
      $('#cCliRes', c).innerHTML = l.map((x, i) => `<button type="button" class="artigo-op" data-c="${i}"><b>${esc(x.nome)}</b> <span class="muted">${esc(x.localidade || '')}</span></button>`).join('') || '<p class="muted">Nenhum cliente.</p>';
      $$('[data-c]', c).forEach((b) => b.onclick = () => {
        cliente = l[+b.dataset.c];
        if (!$('#cEmail', c).value) $('#cEmail', c).value = cliente.email || '';
        desenharCliente();
      });
    });
  };
  desenharCliente();
  const lerEquip = () => $$('[data-eq]', c).forEach((row) => {
    const i = +row.dataset.eq;
    for (const k of ['descricao', 'marca', 'serie', 'local']) equip[i][k] = $(`[data-k="${k}"]`, row).value.trim();
  });
  const desenharEquip = () => {
    $('#cEquip', c).innerHTML = equip.map((e, i) => `<div class="equip-linha" data-eq="${i}">
      <input data-k="descricao" placeholder="Equipamento * (ex.: Split Daikin 3,5 kW)" value="${esc(e.descricao || '')}">
      <div class="grelha-2"><input data-k="marca" placeholder="Marca / modelo" value="${esc(e.marca || '')}"><input data-k="serie" placeholder="N.º de série" value="${esc(e.serie || '')}"></div>
      <div style="display:flex;gap:8px"><input data-k="local" placeholder="Localização (ex.: sala de reuniões)" value="${esc(e.local || '')}"><button type="button" class="lixo" data-xeq="${i}" aria-label="Tirar">✕</button></div>
    </div>`).join('') || '<p class="muted" style="margin:0">Sem equipamentos.</p>';
    $$('[data-xeq]', c).forEach((b) => b.onclick = () => { lerEquip(); equip.splice(+b.dataset.xeq, 1); desenharEquip(); });
  };
  desenharEquip();
  $('#cMaisEq', c).onclick = () => { lerEquip(); equip.push({ id: Date.now().toString(36) + equip.length }); desenharEquip(); };
  $('#cGuardar', c).onclick = () => {
    const erro = (m) => { $('#cErro', c).textContent = m; };
    lerEquip();
    if (!cliente) return erro('Escolha o cliente.');
    const per = $('#cPer', c).value;
    if (!$('#cProx', c).value) return erro('Indique a data da próxima visita.');
    if (!$('#cIni', c).value) return erro('Indique o início do contrato.');
    const prox = deIsoLocal($('#cProx', c).value);
    const ini = deIsoLocal($('#cIni', c).value);
    const fim = $('#cFim', c).value ? deIsoLocal($('#cFim', c).value) : null;
    if (fim && fim < ini) return erro('O fim do contrato não pode ser antes do início.');
    if (prox < ini) return erro('A próxima visita não pode ser antes do início do contrato.');
    const email = $('#cEmail', c).value.trim();
    if (email && !/^[^@\s,;]+@[^@\s,;]+\.[^@\s,;]+$/.test(email)) return erro('Email inválido.');
    const eqs = equip.filter((e) => e.descricao || e.marca || e.serie);
    if (eqs.some((e) => !e.descricao)) return erro('Indique a descrição de cada equipamento.');
    const ant = Math.max(0, Math.min(120, Math.round(Number($('#cAnt', c).value) || 0)));
    const tecUid = $('#cTec', c).value;
    const dados = {
      clienteId: cliente.id, clienteNome: cliente.nome, clienteNif: cliente.nif || '', clienteEmail: email,
      morada: cliente.morada || '', codigoPostal: cliente.codigoPostal || '', localidade: cliente.localidade || '', contacto: cliente.contacto || '', telefone: cliente.telefone || '',
      periodicidade: per, proximaData: Timestamp.fromDate(prox), geracaoEm: Timestamp.fromDate(dataGeracao(prox, ant)), antecedenciaDias: ant,
      horaPreferida: $('#cHora', c).value || '09:00', duracaoPrevista: Math.max(0, Number(String($('#cDur', c).value).replace(',', '.')) || 0),
      tecnicoUid: tecUid, tecnicoNome: tecUid ? ((tecnicos.find((t) => t.uid === tecUid) || {}).nome || '') : '',
      dataInicio: Timestamp.fromDate(ini), dataFim: fim ? Timestamp.fromDate(fim) : null, renovacaoAutomatica: $('#cRen', c).checked,
      ambito: $('#cAmb', c).value.trim(), equipamentos: eqs.map((e, i) => ({ id: e.id || String(i), descricao: e.descricao, marca: e.marca || '', serie: e.serie || '', local: e.local || '' })),
      tarefas: $('#cTar', c).value.split(/\r?\n/).map((t) => t.trim()).filter(Boolean).slice(0, 30),
      atualizadoEm: serverTimestamp(), atualizadoPor: sessao.uid,
    };
    const valor = master ? Number(String($('#cValor', c).value).replace(',', '.')) || 0 : null;
    comBotao($('#cGuardar', c), async () => {
      try {
        let id = ct?.id;
        if (ed) {
          dados.pesquisa = tokensContrato({ ...dados, numero: ct.numero });
          await updateDoc(doc(db, 'contratos', id), dados);
        } else {
          const ano = new Date().getFullYear();
          const cRef = doc(db, 'contadores', 'contratos-' + ano);
          const ref = doc(collection(db, 'contratos'));
          id = ref.id;
          await runTransaction(db, async (tx) => {
            const s = await tx.get(cRef);
            const n = (s.exists() ? s.data().valor : 0) + 1;
            const numero = `CM-${ano}-${String(n).padStart(3, '0')}`;
            tx.set(cRef, { valor: n });
            tx.set(ref, { ...dados, numero, estado: 'Ativo', folhas: [], pesquisa: tokensContrato({ ...dados, numero }), criadoEm: serverTimestamp(), criadoPor: sessao.uid, criadoPorNome: sessao.nome || sessao.email });
          });
        }
        if (master && valor !== null) await setDoc(doc(db, 'contratos', id, 'privado', 'valores'), { valorAnual: valor, atualizadoEm: serverTimestamp() });
        fecharModal();
        toast('Contrato guardado.', 'ok');
        lista = [];
        if (ed) abrirDetalhe(id);
        else { history.replaceState({}, '', pagina('contratos', { id })); abrirDetalhe(id); }
        // se a próxima visita já está dentro da antecedência, gera logo a folha
        if (dataGeracao(prox, ant) <= new Date()) {
          const r = await gerarVisitaContrato(id).catch(() => null);
          if (r) { toast(`Folha ${r.numero} gerada para a próxima visita («Por agendar»).`, 'ok', 6000); abrirDetalhe(id); }
        }
      } catch (e) { erro(erroFirebase(e)); }
    });
  };
}

rota();
verGeracao();

</script>
