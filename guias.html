function inicioDia(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }

// NIF: português com dígito de controlo; estrangeiro com indicativo do país (ex.: ES B12345678).
function validarNIF(entrada) {
  const v = String(entrada || '').toUpperCase().replace(/[\s.\-/]/g, '');
  if (!v) return { ok: false, erro: 'O NIF é obrigatório.' };
  const pt = v.startsWith('PT') ? v.slice(2) : v;
  if (/^\d+$/.test(pt)) {
    if (pt.length !== 9) return { ok: false, erro: 'O NIF português tem 9 dígitos.' };
    if (!/^([1235689]|45|7[0-9])/.test(pt)) return { ok: false, erro: 'NIF português com início inválido.' };
    let soma = 0;
    for (let i = 0; i < 8; i++) soma += Number(pt[i]) * (9 - i);
    let ctrl = 11 - (soma % 11);
    if (ctrl >= 10) ctrl = 0;
    if (ctrl !== Number(pt[8])) return { ok: false, erro: 'NIF inválido (dígito de controlo errado).' };
    return { ok: true, nif: pt, pais: 'PT' };
  }
  const m = v.match(/^([A-Z]{2})([A-Z0-9]{2,13})$/);
  if (m && m[1] !== 'PT' && /\d/.test(m[2])) return { ok: true, nif: v, pais: m[1] };
  return { ok: false, erro: 'NIF inválido. Estrangeiro: indicativo do país + número (ex.: ES B12345678).' };
}

}

const ICONES = {

function montarCabecalho() {

}

// Garante sessão iniciada com perfil ativo. Sem sessão → login. Sem perfil → login (mostra o UID).
function iniciarPagina({ perfis = null } = {}) {
  return new Promise((resolve) => {
    let feito = false;
    onAuthStateChanged(auth, async (user) => {
      if (feito) return;
      feito = true;
      if (!user) { location.replace(pagina('index')); return; }
      try {
        const snap = await getDoc(doc(db, 'utilizadores', user.uid));
        if (!snap.exists() || snap.data().ativo !== true) { location.replace(pagina('index')); return; }
        SESSAO = { uid: user.uid, email: user.email, ...snap.data() };
      } catch (e) {
        $('#main').innerHTML = `<div class="vazio">Não foi possível carregar o perfil: ${esc(erroFirebase(e))}</div>`;
        return;
      }
      montarCabecalho();
      if (perfis && !perfis.includes(SESSAO.perfil)) {
        $('#main').innerHTML = '<div class="vazio">Não tem acesso a esta página.</div>';
        return;
      }
      document.body.classList.add('perfil-' + SESSAO.perfil);
      resolve(SESSAO);
    });
  });
}

// ---------- Pesquisa de clientes ----------
// Cada cliente guarda `pesquisa`: prefixos (2+ letras) de cada palavra do nome e da localidade.
// Assim "hot" encontra "Hotel Meliá" e "meli" também, com uma só consulta (array-contains).
const normalizar = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function tokensPesquisa(...textos) {
  const set = new Set();
  for (const t of textos) {
    for (const p of normalizar(t).split(/[^a-z0-9]+/)) {
      for (let i = 2; i <= Math.min(p.length, 15); i++) set.add(p.slice(0, i));
    }
  }
  return [...set];
}

async function pesquisarClientes(texto, { soAtivos = false } = {}) {
  const t = String(texto || '').trim();
  const n = validarNIF(t);
  const palavras = normalizar(t).split(/[^a-z0-9]+/).filter((p) => p.length >= 2).map((p) => p.slice(0, 15));
  let docs = [];
  if (n.ok) {
    docs = (await getDocs(query(collection(db, 'clientes'), where('nif', '==', n.nif), limit(10)))).docs;
  } else {
    const consultas = [];
    if (palavras.length) {
      const chave = palavras.reduce((a, b) => (b.length > a.length ? b : a));
      consultas.push(getDocs(query(collection(db, 'clientes'), where('pesquisa', 'array-contains', chave), limit(PAGINA_TAM)))
        .then((sn) => sn.docs.filter((d) => palavras.every((p) => (d.data().pesquisa || []).includes(p)))));
    }
    // início do nome, também para siglas («M. D.», «MDA» → «m. d. a. - moldes…» / «m.d.a.»)
    for (const pre of prefixosNome(t)) {
      consultas.push(getDocs(query(collection(db, 'clientes'), orderBy('nomePesquisa'), startAt(pre), endAt(pre + '\uf8ff'), limit(PAGINA_TAM))).then((sn) => sn.docs));
    }
    const vistos = new Set();
    for (const l of await Promise.all(consultas)) for (const d of l) if (!vistos.has(d.id)) { vistos.add(d.id); docs.push(d); }
  }
  return docs.map((d) => ({ id: d.id, ...d.data() }))
    .filter((c) => !soAtivos || c.ativo !== false)
    .sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt'));
}
function prefixosNome(t) {
  const base = normalizar(t).replace(/\s+/g, ' ').trim();
  if (base.length < 2) return [];
  const l = new Set([base]);
  const letras = base.replace(/[^a-z0-9]/g, '');
  // parece uma sigla: letras soltas com pontos/espaços, ou uma palavra curta
  if (letras.length >= 2 && letras.length <= 5 && (/^([a-z0-9][. ]*)+$/.test(base) && (base.includes('.') || base.includes(' ') || letras.length <= 4))) {
    const c = letras.split('');
    l.add(c.join('. ') + '.'); l.add(c.join('.') + '.'); l.add(c.join(' '));
  }
  return [...l].slice(0, 4);
}

// ---------- Duração prevista: real (mediana do PHC, calculada pela PontePHC em listas/duracoes) ou por omissão ----------
// duração habitual de um tipo, sem esperar (depois de duracaoSugerida já ter sido chamada uma vez)
function duracaoTipo(tipo) {
  const t = ((_duracoesDados || {}).porTipo || {})[tipo];
  return t && t.n >= 5 ? t.h : (DURACAO_PADRAO[tipo] || 2);
}
const fmtHorasD = (h) => String(Number(h) || 0).replace('.', ',') + ' h';
const DURACAO_PADRAO = { AT: 2, 'Manutenção': 1.5, 'Instalação': 4 };
let _duracoes = null, _duracoesDados = null;
async function duracaoSugerida(clienteId, tipo) {
  if (!_duracoes) {
    _duracoes = getDoc(doc(db, 'listas', 'duracoes')).then((s) => (s.exists() ? s.data() : {})).catch(() => ({}));
  }
  const d = await _duracoes;
  _duracoesDados = d;
  const c = ((d.porCliente || {})[clienteId] || {})[tipo];
  if (c && c.n >= 2) return { h: c.h, n: c.n, fonte: 'cliente' };
  const t = (d.porTipo || {})[tipo];
  if (t && t.n >= 5) return { h: t.h, n: t.n, fonte: 'tipo' };
  return { h: DURACAO_PADRAO[tipo] || 2, n: 0, fonte: 'padrao' };
}

// ---------- Artigos (stock do armazém da climatização, vindo do PHC) ----------
// disponível = stock − reservado em FO abertas no PHC − ainda em guias abertas no PHC
//              − reservado em folhas da plataforma − em guias abertas da plataforma
const r3 = (n) => Math.round((Number(n) || 0) * 1000) / 1000;
function disponivel(a) {
  return r3((a.stock || 0) - (a.reservadoPHC || 0) - (a.emGuiasPHC || 0) - (a.resFolhas || 0) - (a.resGuias || 0));
}
const fmtQtd = (n) => r3(n).toLocaleString('pt-PT', { maximumFractionDigits: 3 });
async function pesquisarArtigos(texto) {
  const palavras = normalizar(texto).split(/[^a-z0-9]+/).filter((p) => p.length >= 2).map((p) => p.slice(0, 15));
  if (!palavras.length) return [];
  const chave = palavras.reduce((a, b) => (b.length > a.length ? b : a));
  const snap = await getDocs(query(collection(db, 'artigos'), where('pesquisa', 'array-contains', chave), limit(PAGINA_TAM)));
  return snap.docs.map((d) => ({ id: d.id, ...d.data() }))
    .filter((a) => a.ativo !== false && palavras.every((p) => (a.pesquisa || []).includes(p)))
    .sort((a, b) => disponivel(b) - disponivel(a) || (a.ref || '').localeCompare(b.ref || ''));
}
// Acumula movimentos de reserva por artigo e aplica-os dentro de uma transação (lê primeiro, escreve depois).
// mov: { artigoId: { resFolhas: +x, resGuias: -y } }; exigeDisponivel: artigos que não podem ficar negativos.
async function aplicarReservas(tx, mov, exigeDisponivel = new Set()) {
  const ids = Object.keys(mov);
  const docs = {};
  for (const id of ids) {
    const s = await tx.get(doc(db, 'artigos', id));
    if (!s.exists()) throw Object.assign(new Error('Artigo não encontrado: ' + id), { code: 'artigo' });
    docs[id] = s.data();
  }
  return () => {
    for (const id of ids) {
      const a = docs[id];
      const novo = { resFolhas: r3((a.resFolhas || 0) + (mov[id].resFolhas || 0)), resGuias: r3((a.resGuias || 0) + (mov[id].resGuias || 0)) };
      if (novo.resFolhas < 0) novo.resFolhas = 0;
      if (novo.resGuias < 0) novo.resGuias = 0;
      if (exigeDisponivel.has(id) && disponivel({ ...a, ...novo }) < -0.0005) {
        throw Object.assign(new Error(`Sem stock disponível de ${a.ref} (disponível: ${fmtQtd(disponivel(a))} ${a.unidade || ''}).`), { code: 'stock' });
      }
      tx.update(doc(db, 'artigos', id), { ...novo, resAtualizadoEm: serverTimestamp() });
    }
  };
}
// N.º de série → id do documento em series/ (maiúsculas, sem espaços; «/» e outros trocados por ~XX)
function idSerie(sr) {
  return String(sr || '').toUpperCase().replace(/\s+/g, '').replace(/[^A-Z0-9._-]/g, (c) => '~' + c.charCodeAt(0).toString(16).toUpperCase().padStart(2, '0'));
}
function limparSerie(sr) { return String(sr || '').trim().toUpperCase().replace(/\s+/g, ''); }

// Procura um n.º de série: onde está a ser usado na plataforma (series/) e, se estiver no armazém AC do PHC
// (equipamentos/, vindo da tabela MA pela PontePHC), o artigo a que pertence. Só a pedido (2–3 leituras).
async function procurarSerie(texto) {
  const t = limparSerie(texto);
  if (t.length < 3 || /\s/.test(String(texto).trim())) return null;
  const id = idSerie(t);
  const [so, se] = await Promise.all([getDoc(doc(db, 'series', id)), getDoc(doc(db, 'equipamentos', id)).catch(() => null)]);
  const r = { serie: t, uso: so.exists() ? so.data() : null, equip: se && se.exists() ? se.data() : null, artigo: null };
  if (r.equip) r.serie = r.equip.serie || t;
  if (r.equip && r.equip.artigoId) {
    try { const a = await getDoc(doc(db, 'artigos', r.equip.artigoId)); if (a.exists()) r.artigo = { id: a.id, ...a.data() }; } catch (e) { /* sem artigo */ }
  }
  return r.uso || r.equip ? r : null;
}

// Ao faturar/anular uma folha, o material dela deixa de estar reservado na plataforma.
function movLibertarFolha(f) {
  const mov = {};
  for (const m of f.materiais || []) if (m.artigoId) (mov[m.artigoId] = mov[m.artigoId] || { resFolhas: 0 }).resFolhas -= Number(m.qtd) || 0;
  return mov;
}

// ---------- «Sincronizar com o PHC agora» (staff): a PontePHC vê o pedido em ~30 s e corre um ciclo completo ----------
async function pedirSincronizacao(btn, aoConcluir) {
  await comBotao(btn, async () => {
    const ref = doc(db, 'controlo', 'sincronizar');
    try {
      await setDoc(ref, { estado: 'Pedido', pedidoEm: serverTimestamp(), pedidoPor: SESSAO.uid, pedidoPorNome: SESSAO.nome || SESSAO.email });
    } catch (e) { toast(erroFirebase(e), 'erro'); return; }
    toast('Pedido enviado ao servidor. A sincronização demora 1 a 2 minutos…', 'ok', 6000);
    for (let i = 0; i < 24; i++) {   // até 4 minutos, uma leitura a cada 10 s
      await new Promise((r) => setTimeout(r, 10000));
      let d;
      try { d = (await getDoc(ref)).data() || {}; } catch (e) { continue; }
      if (d.estado === 'Concluído') {
        toast('Sincronização com o PHC concluída' + (d.resultado && d.resultado !== 'OK' ? ': ' + d.resultado : '.'), d.resultado === 'OK' ? 'ok' : 'erro', 6000);
        if (aoConcluir) aoConcluir();
        return;
      }
    }
    toast('O servidor ainda não respondeu. Confirme que o serviço PontePHC está a correr.', 'erro', 8000);
  });
}

// ---------- Folhas de obra: criação (partilhada pela página Folhas e pela geração dos contratos) ----------
// Prefixos para a pesquisa (n.º, cliente, NIF, avaria) — iguais aos que a PontePHC grava nas folhas do PHC.
function tokensFolha(numero, clienteNome, nif, descricao) {
  const n = String(numero || '');
  return tokensPesquisa(n, n.split('-').pop().replace(/^0+/, ''), clienteNome, String(nif || '').replace(/\D/g, ''), descricao).slice(0, 400);
}
// Numeração FO-AAAA-NNNN no contador do ano; toda a folha nova nasce «Por agendar». extraTx(tx, fRef, numero) corre na mesma transação.
async function criarFolhaNova(cliente, dados, extraTx = null) {
  const ano = new Date().getFullYear();
  const cRef = doc(db, 'contadores', 'folhas-' + ano);
  const fRef = doc(collection(db, 'folhas'));
  let numero = '';
  await runTransaction(db, async (tx) => {
    const c = await tx.get(cRef);
    const pre = extraTx ? await extraTx(tx, null, null) : null;   // leituras extra (antes das escritas)
    const n = (c.exists() ? c.data().valor : 0) + 1;
    numero = `FO-${ano}-${String(n).padStart(4, '0')}`;
    tx.set(cRef, { valor: n });
    tx.set(fRef, {
      ...dados,
      numero,
      clienteId: cliente.id, clienteNome: cliente.nome, clienteNif: cliente.nif || '', clienteEmail: dados.clienteEmail || cliente.email || '',
      pesquisa: tokensFolha(numero, cliente.nome, cliente.nif, dados.descricao),
      estado: 'Por agendar',
      historico: [{ estado: 'Por agendar', de: null, uid: SESSAO.uid, nome: SESSAO.nome || SESSAO.email, em: Timestamp.now(), ...(dados.contratoId ? { nota: 'Gerada pelo contrato ' + dados.contratoNumero } : {}) }],
      observacoesTecnico: '',
      criadoEm: serverTimestamp(), criadoPor: SESSAO.uid, criadoPorNome: SESSAO.nome || SESSAO.email,
      estadoAlteradoEm: serverTimestamp(),
    });
    if (pre) pre(fRef, numero);
  });
  return fRef.id;
}

// ---------- Contratos de manutenção ----------
const PERIODICIDADES = { Mensal: 1, Bimestral: 2, Trimestral: 3, Semestral: 6, Anual: 12 };
function addMeses(d, n) {
  const x = new Date(d);
  const dia = x.getDate();
  x.setDate(1); x.setMonth(x.getMonth() + n);
  const ult = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate();
  x.setDate(Math.min(dia, ult));
  return x;
}
// Quando gerar a folha da visita: «antecedência» dias antes da data da visita.
function dataGeracao(proxima, antecedencia) { return addDias(inicioDia(proxima), -(Number(antecedencia) || 0)); }
function descricaoVisita(ct) {
  const eq = (ct.equipamentos || []).map((e) => [e.descricao, e.marca, e.serie ? 'n.º ' + e.serie : '', e.local].filter(Boolean).join(' · '));
  return [`Manutenção ${String(ct.periodicidade || '').toLowerCase()} — contrato ${ct.numero}.`, ct.ambito || '', eq.length ? 'Equipamentos:\n- ' + eq.join('\n- ') : '']
    .filter(Boolean).join('\n');
}
// Gera a folha da próxima visita de um contrato e avança a próxima data, numa só transação (nunca duplica).
async function gerarVisitaContrato(ctId, { forcar = false } = {}) {
  const ctRef = doc(db, 'contratos', ctId);
  const ct0 = (await getDoc(ctRef)).data();
  if (!ct0 || ct0.estado !== 'Ativo' || !ct0.proximaData) return null;
  const prox = paraData(ct0.proximaData);
  if (!forcar && dataGeracao(prox, ct0.antecedenciaDias) > new Date()) return null;
  if (ct0.dataFim && prox > paraData(ct0.dataFim) && !ct0.renovacaoAutomatica) return null;
  const [h, m] = String(ct0.horaPreferida || '09:00').split(':').map(Number);
  const quando = new Date(prox); quando.setHours(h || 9, m || 0, 0, 0);
  const cliente = { id: ct0.clienteId, nome: ct0.clienteNome, nif: ct0.clienteNif || '', email: ct0.clienteEmail || '' };
  const dados = {
    tipo: 'Manutenção', tecnicoUid: ct0.tecnicoUid || '', tecnicoNome: ct0.tecnicoNome || '',
    dataPrevista: Timestamp.fromDate(quando), duracaoPrevista: Number(ct0.duracaoPrevista) || 0,
    morada: ct0.morada || '', codigoPostal: ct0.codigoPostal || '', localidade: ct0.localidade || '', contacto: ct0.contacto || '', telefone: ct0.telefone || '',
    descricao: descricaoVisita(ct0), tarefasExtra: (ct0.tarefas || []).slice(0, 30),
    origem: 'contrato', contratoId: ctId, contratoNumero: ct0.numero, atualizadoEm: serverTimestamp(), atualizadoPor: SESSAO.uid,
  };
  let gerada = null;
  const id = await criarFolhaNova(cliente, dados, async (tx) => {
    const s = await tx.get(ctRef);
    const ct = s.data();
    // outro utilizador gerou entretanto?
    if (!ct || ct.estado !== 'Ativo' || !ct.proximaData || paraData(ct.proximaData).getTime() !== prox.getTime()) throw Object.assign(new Error('já gerada'), { code: 'ja-gerada' });
    return (fRef, numero) => {
      let nova = addMeses(prox, PERIODICIDADES[ct.periodicidade] || 12);
      const alt = { proximaData: Timestamp.fromDate(nova), geracaoEm: Timestamp.fromDate(dataGeracao(nova, ct.antecedenciaDias)),
        ultimaVisita: Timestamp.fromDate(prox), atualizadoEm: serverTimestamp(), atualizadoPor: SESSAO.uid,
        folhas: [{ folhaId: fRef.id, numero, data: Timestamp.fromDate(quando) }, ...(ct.folhas || [])].slice(0, 24) };
      // fim do contrato: renova por mais um ano, ou deixa de gerar
      if (ct.dataFim && nova > paraData(ct.dataFim)) {
        if (ct.renovacaoAutomatica) alt.dataFim = Timestamp.fromDate(addMeses(paraData(ct.dataFim), 12));
        else alt.geracaoEm = Timestamp.fromDate(new Date(2999, 0, 1));
      }
      tx.update(ctRef, alt);
      gerada = numero;
    };
  }).catch((e) => { if (e.code === 'ja-gerada') return null; throw e; });
  return id ? { id, numero: gerada } : null;
}
// Gera todas as visitas em falta (contratos ativos com data de geração já passada). Corre ao abrir as páginas (staff), no máx. 1 vez por hora neste aparelho.
async function gerarManutencoesPendentes({ forcar = false } = {}) {
  if (!ehStaff(SESSAO.perfil)) return [];
  const chave = 'manut.ultima.' + SESSAO.uid;
  try { if (!forcar && Date.now() - Number(localStorage.getItem(chave) || 0) < 3600e3) return []; } catch (e) { /* sem storage */ }
  const feitas = [];
  try {
    for (let volta = 0; volta < 3; volta++) {   // até 3 visitas em atraso por contrato
      const snap = await getDocs(query(collection(db, 'contratos'), where('estado', '==', 'Ativo'), where('geracaoEm', '<=', Timestamp.now()), orderBy('geracaoEm'), limit(20)));
      if (snap.empty) break;
      let nesta = 0;
      for (const d of snap.docs) { const r = await gerarVisitaContrato(d.id); if (r) { feitas.push(r); nesta++; } }
      if (!nesta) break;
    }
    try { localStorage.setItem(chave, String(Date.now())); } catch (e) { /* sem storage */ }
  } catch (e) { console.warn('Contratos:', e); }
  return feitas;
}

      <div class="det-cab"><div><h1 id="detNumero">${esc(nomeGuia(g))}</h1><span class="tipo">Guia de Transporte AC · viatura ${esc(g.viatura)}</span></div>
        <div>${badgeEstado(g.estado)}</div></div>
      ${g.estado === 'Por comunicar' ? `<p class="aviso-at" id="avisoAT"><b>Sem código AT.</b> A guia ainda não foi comunicada à Autoridade Tributária: o material não pode sair e a guia não pode ser impressa.</p>`
        : g.codigoAT ? `<p class="ok-at">Código AT <b id="codigoAT">${esc(g.codigoAT)}</b></p>` : ''}
      <dl class="dl">
        <div><dt>Destinatário (cliente)</dt><dd>${esc(g.clienteNome)}${g.clienteNif ? `<br><span class="muted">NIF ${esc(g.clienteNif)}</span>` : ''}</dd></div>
        <div><dt>Local de descarga</dt><dd>${esc([g.morada, [g.codigoPostal, g.localidade].filter(Boolean).join(' ')].filter(Boolean).join('\n') || '—')}</dd></div>
        <div><dt>Carga</dt><dd>Armazém ${esc(String(g.armazem || 99))} · ${esc(fmtDiaSemana(paraData(g.dataSaida)))}, ${esc(fmtHora(g.dataSaida))}</dd></div>
        <div><dt>Técnico</dt><dd>${esc(g.tecnicoNome || '—')}</dd></div>
        ${g.folhaId ? `<div><dt>Folha de obra prevista</dt><dd><a href="${pagina('folhas', { id: g.folhaId })}">${esc(g.folhaNumero || 'abrir')}</a></dd></div>` : ''}
      </dl>
    </div>
    <div class="cartao">
      <h3 style="margin-top:0">Material</h3>
      <table class="tabela-guia" id="linhasGuia"><thead><tr><th>Artigo</th><th class="n">Levou</th><th class="n">Gasto</th><th class="n">${g.estado === 'Fechada' ? 'Devolvido' : 'Por gastar'}</th></tr></thead><tbody>
        ${(g.linhas || []).map((l) => `<tr><td><b>${esc(l.ref)}</b><br>${esc(l.design)}${(l.series || []).length ? `<br>${l.series.map((x) => `<span class="serie-tag" style="${(l.seriesUsadas || []).includes(x) ? 'text-decoration:line-through' : ''}">${esc(x)}</span>`).join('')}` : ''}${(l.consumos || []).length ? `<br><span class="muted">${l.consumos.map((c) => `${esc(c.numero)}: ${esc(fmtQtd(c.qtd))}`).join(' · ')}</span>` : ''}</td>
          <td class="n">${esc(fmtQtd(l.qtd))} ${esc(l.unidade || '')}</td><td class="n">${esc(fmtQtd(l.consumido || 0))}</td>
          <td class="n">${esc(fmtQtd(g.estado === 'Fechada' ? (l.devolvido || 0) : saldo(l)))}</td></tr>`).join('')}
      </tbody></table>
    </div>
    ${meu && ['Por comunicar', 'Comunicada'].includes(g.estado) ? `<div class="cartao estados-acoes">
      ${g.codigoAT ? '<button class="btn btn-sec" id="btnImprimir">Imprimir</button>' : ''}
      ${g.estado === 'Comunicada' ? '<button class="btn" id="btnFechar">Fechar guia (devolver o que sobrou)</button>' : ''}
      ${g.estado === 'Por comunicar' ? '<button class="btn btn-perigo" id="btnAnular">Anular guia</button>' : ''}
    </div>` : ''}
    <div class="cartao">
      <h3 style="margin-top:0">Histórico</h3>
      <ul class="hist">${(g.historico || []).slice().reverse().map((h) => `<li>${badgeEstado(h.estado)}<span>${esc(h.nome || '')}${h.nota ? ' · ' + esc(h.nota) : ''}</span><span class="muted">${esc(fmtDataHora(h.em))}</span></li>`).join('')}</ul>
    </div>`);
  if ($('#btnImprimir')) $('#btnImprimir').onclick = () => window.print();
  if ($('#btnFechar')) $('#btnFechar').onclick = () => fecharGuia($('#btnFechar'));
  if ($('#btnAnular')) $('#btnAnular').onclick = () => anularGuia($('#btnAnular'));
}

// Fechar: o que não foi gasto deixa de estar na guia (volta ao disponível do armazém).
async function fecharGuia(btn) {
  const sobra = (atual.linhas || []).filter((l) => saldo(l) > 0.0005);
  const msg = sobra.length
    ? `Fechar a guia? Fica registado como devolvido: ${sobra.map((l) => `${fmtQtd(saldo(l))} ${l.unidade || ''} de ${l.ref}`).join(', ')}. O regresso deste material ao armazém precisa de documento de transporte próprio.`
    : 'Fechar a guia? Todo o material foi passado para folhas de obra.';
  if (!(await confirmar(msg, { ok: 'Fechar guia' }))) return;
  await mudarGuia(btn, 'Fechada', (g) => {
    const mov = {};
    const linhas = g.linhas.map((l) => {
      const x = saldo(l);
      if (x > 0) (mov[l.artigoId] = mov[l.artigoId] || { resGuias: 0 }).resGuias -= x;
      return { ...l, devolvido: r3((l.devolvido || 0) + Math.max(x, 0)) };
    });
    return { alt: { linhas }, mov };
  }, sobra.length ? 'Devolvido o que sobrou' : '');
}
async function anularGuia(btn) {
  if (!(await confirmar('Anular esta guia? O material volta a ficar disponível.', { ok: 'Anular', perigo: true }))) return;
  await mudarGuia(btn, 'Anulada', (g) => {
    const mov = {};
    for (const l of g.linhas) (mov[l.artigoId] = mov[l.artigoId] || { resGuias: 0 }).resGuias -= saldo(l);
    return { alt: {}, mov };
  }, '');
}
async function mudarGuia(btn, novo, fn, nota) {
  await comBotao(btn, async () => {
    try {
      const ref = doc(db, 'guias', atual.id);
      const res = await runTransaction(db, async (tx) => {
        const s = await tx.get(ref);
        const g = s.data();
        if (g.estado !== atual.estado) throw Object.assign(new Error('A guia foi alterada por outra pessoa. Atualize a página.'), { code: 'guia' });
        const { alt, mov } = fn(g);
        const aplicar = Object.keys(mov).length ? await aplicarReservas(tx, mov) : null;
        // n.º de série que não foram aplicados deixam de estar na guia
        for (const l of g.linhas) for (const sr of (l.series || []).filter((x) => !(l.seriesUsadas || []).includes(x))) tx.delete(doc(db, 'series', idSerie(sr)));
        const h = { estado: novo, de: g.estado, uid: sessao.uid, nome: sessao.nome || sessao.email, em: Timestamp.now() };
        if (nota) h.nota = nota;
        const tudo = { ...alt, estado: novo, historico: [...(g.historico || []), h], atualizadoEm: serverTimestamp(), atualizadoPor: sessao.uid };
        tx.update(ref, tudo);
        if (aplicar) aplicar();
        return { ...g, ...tudo };
      });
      atual = { id: atual.id, ...res };
      lista = [];
      toast('Guia ' + (novo === 'Fechada' ? 'fechada.' : 'anulada.'), 'ok');
      renderDetalhe();
    } catch (e) { toast(['stock', 'artigo', 'guia', 'serie'].includes(e.code) ? e.message : erroFirebase(e), 'erro', 6000); }
  });
}

// ---------- Nova guia ----------
async function formNova(folhaId) {
  let folha = null, cliente = null;
  const linhas = [];
  mostrar('<div class="vazio">A carregar…</div>');
  try {
    if (folhaId) {
      const s = await getDoc(doc(db, 'folhas', folhaId));
      if (s.exists()) folha = { id: s.id, ...s.data() };
    }
  } catch (e) { toast(erroFirebase(e), 'erro'); }
  if (tecnico && !folha) {
    mostrar('<div class="cartao"><p style="margin:0">Para criar uma guia, abra a folha de obra e use «Nova guia de transporte».</p></div>');
    return;
  }
  if (folha) cliente = { id: folha.clienteId, nome: folha.clienteNome, nif: folha.clienteNif || '', morada: folha.morada || '', cp: folha.codigoPostal || '', loc: folha.localidade || '' };
  let viaturas = [];
  try { const v = await getDoc(doc(db, 'listas', 'viaturas')); if (v.exists()) viaturas = v.data().itens || []; } catch (e) { /* sem lista */ }
  const tecs = staff ? await carregarTecnicos().catch(() => []) : [];
  const agora = new Date(Date.now() + 10 * 60000);
  mostrar(`
    <div class="cartao">
      <h1 style="margin-top:0">Nova guia de transporte</h1>
      <p class="muted" style="margin-top:0">Fica «Por comunicar»: só pode sair depois de ter código AT.</p>
      <div class="campo"><span>Cliente (destinatário) *</span><div id="gCliente"></div></div>
      ${folha ? `<p class="muted">Folha de obra: <b>${esc(folha.numero)}</b></p>` : ''}
      ${staff ? `<label class="campo"><span>Técnico *</span><select id="gTec"><option value="">—</option>${tecs.map((t) => `<option value="${esc(t.uid)}" ${folha && folha.tecnicoUid === t.uid ? 'selected' : ''}>${esc(t.nome)}</option>`).join('')}</select></label>` : ''}
      <label class="campo"><span>Viatura (matrícula) *</span>${viaturas.length
        ? `<select id="gViatura"><option value="">—</option>${viaturas.map((v) => `<option>${esc(v)}</option>`).join('')}</select>`
        : '<input id="gViatura" maxlength="12" placeholder="AA-00-AA" autocomplete="off">'}</label>
      <div class="grelha-2">
        <label class="campo"><span>Dia de saída *</span><input type="date" id="gDia" value="${isoLocal(agora)}"></label>
        <label class="campo"><span>Hora *</span><input type="time" id="gHora" value="${String(agora.getHours()).padStart(2, '0')}:${String(agora.getMinutes()).padStart(2, '0')}"></label>
      </div>
    </div>
    <div class="cartao">
      <h3 style="margin-top:0">Material (armazém 99)</h3>
      <div style="display:flex;gap:8px"><input id="gProc" autocomplete="off" placeholder="Referência, nome ou n.º de série"><button class="btn" id="gProcBtn" type="button">Procurar</button></div>
      <div id="gRes" style="margin-top:8px"></div>
      <div id="gLinhas"></div>
    </div>
    <div class="msg-erro" id="gErro"></div>
    <div class="acoes"><button class="btn" id="gCancelar">Cancelar</button><button class="btn btn-primario" id="gGuardar">Criar guia</button></div>`);
  const desenharCliente = () => {
    $('#gCliente').innerHTML = cliente
      ? `<div class="cliente-escolhido"><b>${esc(cliente.nome)}</b><br><span class="muted">${esc([cliente.morada, cliente.cp, cliente.loc].filter(Boolean).join(', '))}</span>${!folha ? ' <button type="button" class="btn btn-peq" id="gTrocar">Trocar</button>' : ''}</div>`
      : `<div style="display:flex;gap:8px"><input id="gCliProc" placeholder="Nome, NIF ou localidade" autocomplete="off"><button type="button" class="btn" id="gCliBtn">Procurar</button></div><div id="gCliRes"></div>`;
    if ($('#gTrocar')) $('#gTrocar').onclick = () => { cliente = null; desenharCliente(); };
    if ($('#gCliBtn')) $('#gCliBtn').onclick = () => comBotao($('#gCliBtn'), async () => {
      const l = await pesquisarClientes($('#gCliProc').value, { soAtivos: true }).catch((e) => { toast(erroFirebase(e), 'erro'); return []; });
      $('#gCliRes').innerHTML = l.map((x, i) => `<button type="button" class="artigo-op" data-c="${i}"><b>${esc(x.nome)}</b> <span class="muted">${esc(x.localidade || '')}</span></button>`).join('') || '<p class="muted">Nenhum cliente.</p>';
      $$('[data-c]').forEach((b) => b.onclick = () => {
        const x = l[+b.dataset.c];
        cliente = { id: x.id, nome: x.nome, nif: x.nif || '', morada: x.morada || '', cp: x.codigoPostal || '', loc: x.localidade || '' };
        desenharCliente();
      });
    });
  };
  desenharCliente();
  const desenharLinhas = () => {
    $('#gLinhas').innerHTML = linhas.length ? `<table class="tabela-guia"><thead><tr><th>Artigo</th><th class="n">Qtd.</th><th></th></tr></thead><tbody>
      ${linhas.map((l, i) => `<tr><td><b>${esc(l.a.ref)}</b><br>${esc(l.a.design)}<br><span class="muted">disponível ${esc(fmtQtd(disponivel(l.a)))} ${esc(l.a.unidade || '')}</span>
          ${l.a.comSerie ? `<div class="series-campos" style="margin-top:6px">${Array.from({ length: Math.max(0, Math.min(50, Math.floor(l.qtd || 0))) }, (_, k) =>
            `<input data-sl="${i}" data-sk="${k}" autocomplete="off" placeholder="N.º de série ${k + 1} *" value="${esc((l.series || [])[k] || '')}">`).join('') || '<span class="muted">Com n.º de série: indique a quantidade.</span>'}</div>` : ''}</td>
        <td class="n"><input type="number" inputmode="decimal" min="0" step="${l.a.comSerie ? '1' : 'any'}" value="${l.qtd || ''}" data-q="${i}" style="width:86px"></td>
        <td><button type="button" class="lixo" data-x="${i}" aria-label="Tirar">✕</button></td></tr>`).join('')}</tbody></table>`
      : '<p class="muted">Ainda sem material.</p>';
    $$('[data-q]').forEach((inp) => {
      inp.oninput = () => { linhas[+inp.dataset.q].qtd = r3(String(inp.value).replace(',', '.')); };
      inp.onchange = () => { if (linhas[+inp.dataset.q].a.comSerie) { desenharLinhas(); } };
    });
    $$('[data-sl]').forEach((inp) => inp.oninput = () => { const l = linhas[+inp.dataset.sl]; (l.series = l.series || [])[+inp.dataset.sk] = inp.value; });
    $$('[data-x]').forEach((b) => b.onclick = () => { linhas.splice(+b.dataset.x, 1); desenharLinhas(); });
  };
  desenharLinhas();
  const procurar = () => comBotao($('#gProcBtn'), async () => {
    const t = $('#gProc').value.trim();
    if (t.length < 2) return;
    // n.º de série de um equipamento em armazém: acrescenta logo a linha do artigo com esse n.º
    if (t.length >= 3 && !/\s/.test(t)) {
      const r = await procurarSerie(t).catch(() => null);
      if (r && r.uso) { $('#gRes').innerHTML = `<p class="aviso-concl">O n.º de série ${esc(r.uso.serie)} já está ${r.uso.estado === 'guia' ? 'na guia ' + esc(r.uso.guiaNumero || '(por comunicar)') : 'aplicado na ' + esc(r.uso.folhaNumero || 'outra folha')}.</p>`; return; }
      if (r && r.artigo) {
        let lin = linhas.find((x) => x.a.id === r.artigo.id);
        if (!lin) { lin = { a: r.artigo, qtd: 0, series: [] }; linhas.push(lin); }
        lin.series = (lin.series || []).slice(0, lin.qtd).filter(Boolean);
        if (lin.series.map(idSerie).includes(idSerie(r.serie))) { toast('Esse n.º de série já está na guia.', 'erro'); return; }
        lin.series.push(r.serie);
        lin.qtd = lin.series.length;
        $('#gRes').innerHTML = ''; $('#gProc').value = '';
        desenharLinhas();
        toast(`N.º de série ${r.serie}: ${r.artigo.ref} acrescentado.`, 'ok');
        return;
      }
    }
    const l = await pesquisarArtigos(t).catch((e) => { toast(erroFirebase(e), 'erro'); return []; });
    $('#gRes').innerHTML = l.length ? `<div class="lista-artigos">${l.map((x, i) => `
      <button type="button" class="artigo-op" data-a="${i}" ${disponivel(x) > 0 ? '' : 'disabled'}><b>${esc(x.ref)}</b> ${esc(x.design)}<span class="${disponivel(x) > 0 ? 'disp' : 'disp zero'}">${esc(fmtQtd(disponivel(x)))} ${esc(x.unidade || '')} disp.</span></button>`).join('')}</div>`
      : '<p class="muted">Nenhum artigo encontrado.</p>';
    $$('[data-a]').forEach((b) => b.onclick = () => {
      const a = l[+b.dataset.a];
      if (!linhas.some((x) => x.a.id === a.id)) linhas.push({ a, qtd: 0 });
      $('#gRes').innerHTML = ''; $('#gProc').value = '';
      desenharLinhas();
      const ult = $$('[data-q]').pop(); if (ult) ult.focus();
    });
  });
  $('#gProcBtn').onclick = procurar;
  $('#gProc').onkeydown = (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); procurar(); } };
  $('#gCancelar').onclick = () => { if (folha) location.href = pagina('folhas', { id: folha.id }); else irPara(null); };
  $('#gGuardar').onclick = () => {
    const erro = (m) => { $('#gErro').textContent = m; };
    const viatura = $('#gViatura').value.trim().toUpperCase().replace(/\s+/g, '');
    const tecUid = staff ? $('#gTec').value : sessao.uid;
    const tecNome = staff ? ((tecs.find((t) => t.uid === tecUid) || {}).nome || '') : (sessao.nome || sessao.email);
    if (!cliente) return erro('Escolha o cliente (destinatário).');
    if (!tecUid) return erro('Escolha o técnico.');
    if (viatura.length < 6) return erro('Indique a matrícula da viatura.');
    if (!$('#gDia').value || !$('#gHora').value) return erro('Indique o dia e a hora de saída.');
    const saida = deIsoLocal($('#gDia').value, $('#gHora').value);
    if (saida < new Date(Date.now() - 5 * 60000)) return erro('A hora de saída não pode ser no passado: a guia tem de ser comunicada antes de o material sair.');
    if (!linhas.length) return erro('Acrescente pelo menos um artigo.');
    const sem = linhas.find((l) => !(l.qtd > 0));
    if (sem) return erro(`Indique a quantidade de ${sem.a.ref}.`);
    const excede = linhas.find((l) => l.qtd > disponivel(l.a) + 0.0005);
    if (excede) return erro(`${excede.a.ref}: só há ${fmtQtd(disponivel(excede.a))} ${excede.a.unidade || ''} disponíveis.`);
    const todasSeries = [];
    for (const l of linhas) {
      if (!l.a.comSerie) { l.series = []; continue; }
      if (!Number.isInteger(l.qtd)) return erro(`${l.a.ref}: equipamento com n.º de série, a quantidade tem de ser em unidades.`);
      l.series = (l.series || []).slice(0, l.qtd).map(limparSerie);
      if (l.series.length !== l.qtd || l.series.some((x) => x.length < 3)) return erro(`${l.a.ref}: indique o n.º de série de cada unidade.`);
      todasSeries.push(...l.series);
    }
    if (new Set(todasSeries.map(idSerie)).size !== todasSeries.length) return erro('Há números de série repetidos.');
    comBotao($('#gGuardar'), async () => {
      try {
        const ref = doc(collection(db, 'guias'));
        await runTransaction(db, async (tx) => {
          const mov = {};
          for (const l of linhas) (mov[l.a.id] = mov[l.a.id] || { resGuias: 0 }).resGuias += l.qtd;
          const aplicar = await aplicarReservas(tx, mov, new Set(Object.keys(mov)));
          for (const sr of todasSeries) {
            const x = await tx.get(doc(db, 'series', idSerie(sr)));
            if (x.exists()) {
              const i = x.data();
              throw Object.assign(new Error(i.estado === 'folha' ? `O n.º de série ${sr} já foi aplicado na ${i.folhaNumero}.` : `O n.º de série ${sr} já está noutra guia aberta.`), { code: 'stock' });
            }
          }
          for (const l of linhas) for (const sr of l.series) tx.set(doc(db, 'series', idSerie(sr)), { serie: sr, artigoId: l.a.id, ref: l.a.ref, estado: 'guia', guiaId: ref.id, guiaNumero: '', folhaId: '', folhaNumero: '', atualizadoEm: serverTimestamp(), uid: sessao.uid });
          tx.set(ref, {
            numero: '', codigoAT: '', estado: 'Por comunicar', armazem: 99,
            clienteId: cliente.id, clienteNome: cliente.nome, clienteNif: cliente.nif, morada: cliente.morada, codigoPostal: cliente.cp, localidade: cliente.loc,
            folhaId: folha ? folha.id : '', folhaNumero: folha ? folha.numero : '',
            tecnicoUid: tecUid, tecnicoNome: tecNome, viatura, dataSaida: Timestamp.fromDate(saida),
            linhas: linhas.map((l) => ({ id: novoId(), artigoId: l.a.id, ref: l.a.ref, design: l.a.design, unidade: l.a.unidade || '', qtd: l.qtd, consumido: 0, devolvido: 0, consumos: [],
              ...(l.series.length ? { series: l.series, seriesUsadas: [] } : {}) })),
            historico: [{ estado: 'Por comunicar', de: null, uid: sessao.uid, nome: sessao.nome || sessao.email, em: Timestamp.now() }],
            criadoEm: serverTimestamp(), criadoPor: sessao.uid, criadoPorNome: sessao.nome || sessao.email,
          });
          aplicar();
        });
        toast('Guia criada. Aguarda comunicação à AT.', 'ok', 5000);
        lista = [];
        history.replaceState({}, '', pagina('guias', { id: ref.id }));
        abrirDetalhe(ref.id);
      } catch (e) { erro(['stock', 'artigo'].includes(e.code) ? e.message : erroFirebase(e)); }
    });
  };
}
function novoId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

rota();
