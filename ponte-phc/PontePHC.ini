# PontePHC - configuracao
# Linhas comecadas por # sao comentarios.

# --- PHC (SQL Server): copie estas linhas do GuiasAT.ini
SqlLigacao=Data Source=.;Initial Catalog=ARPURO;Integrated Security=True
# SqlUtilizador=
# A senha do SQL grava-se cifrada com:  PontePHC.exe /senha SqlSenha
# SqlSenha=

# --- Firebase (plataforma de Climatizacao)
FirebaseProjeto=climatizacao-c482a
# Ficheiro da chave da conta de servico (Consola Firebase > Configuracoes do projeto > Contas de servico > Gerar nova chave privada)
ChaveServico=chave-servico.json

# --- Clientes
Clientes=1
# Nao enviar clientes inativos (os que ficarem inativos depois do arranque sao enviados como inativos)
IgnorarInativos=1
# So clientes com documentos destas series (numeros separados por virgulas; veja PontePHC.exe /series).
# Vazio nas duas = todos os clientes ativos.
SeriesFaturas=
SeriesDossiers=
# Opcional: so contam documentos a partir desta data (AAAA-MM-DD)
DocumentosDesde=
# Clientes criados no PHC depois do arranque entram logo (mesmo sem documentos)
IncluirNovosClientes=1
# Clientes que receberam documentos nestes ultimos dias sao verificados a cada ciclo
DiasDocumentos=3
# Filtro SQL opcional, ex.:  AND cl.tipo = 'Climatizacao'
ClientesFiltro=
# De quantos em quantos minutos verifica alteracoes no PHC
IntervaloMinutos=10
# Limite de escritas por dia no Firebase (plano gratuito: 20000)
MaxEscritasPorDia=15000

# 1 = so regista no log o que enviaria (nada e enviado). Mude para 0 depois de testar.
Simular=1

# --- Email (Exchange interno)
SmtpServidor=srv01.RedeMovel.local
SmtpPorta=25
SmtpSsl=0
# Se o Exchange pedir autenticacao: preencha SmtpUtilizador (ex.: REDEMOVEL\noreply) e corra PontePHC.exe /senha SmtpSenha
SmtpUtilizador=
EmailDe=noreply@arpuro.pt
EmailNomeDe=Arpuro Climatizacao
EmailResponderPara=rbastos@arpuro.pt
EmailCopiaOculta=rbastos@arpuro.pt
